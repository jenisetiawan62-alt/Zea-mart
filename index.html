      name,
      categoryId: Number(document.getElementById("f-cat").value),
      unit: document.getElementById("f-unit").value.trim() || "pcs",
      costPrice: Math.max(0, Number(document.getElementById("f-cost").value) || 0),
      sellPrice: Math.max(0, Number(document.getElementById("f-sell").value) || 0),
      minStock: Math.max(0, Number(document.getElementById("f-min").value) || 0),
      sku: document.getElementById("f-sku").value.trim(),
      barcode: document.getElementById("f-barcode").value.trim(),
      updatedAt: DB.nowIso(),
    };
    if (id) {
      await DB.db.products.update(id, data);
      App.toast("Produk diperbarui");
    } else {
      data.stock = Math.max(0, Number(document.getElementById("f-stock").value) || 0);
      data.isActive = 1;
      data.createdAt = DB.nowIso();
      const newId = await DB.db.products.add(data);
      if (data.stock > 0) {
        await DB.db.stock_movements.add({
          productId: newId, type: "INITIAL", quantity: data.stock,
          stockBefore: 0, stockAfter: data.stock,
          referenceType: null, referenceId: null,
          note: "Stok awal", createdAt: data.createdAt,
        });
      }
      App.toast("Produk ditambahkan");
    }
    App.closeModal();
    App.route();
  }

  function catFormHtml() {
    return `
      <div class="modal-head"><h3>Kelola Kategori</h3>
        <button class="modal-x" onclick="App.closeModal()">${icon('x', 16)}</button></div>
      <div class="modal-body">
        <div id="cat-list">${categories.map((c) => {
          const n = products.filter((p) => p.categoryId === c.id).length;
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)">
            <b>${App.esc(c.name)} <span style="color:var(--muted);font-weight:500">(${n} produk)</span></b>
            <button class="btn btn-danger btn-sm" data-delcat="${c.id}">${icon('trash', 14)} Hapus</button></div>`;
        }).join("") || `<div class="empty">Belum ada kategori.</div>`}</div>
        <div class="frow" style="margin-top:14px">
          <div class="field" style="margin:0"><input id="c-new" placeholder="Nama kategori baru"></div>
          <button class="btn btn-primary" id="c-add" style="white-space:nowrap">Tambah</button>
        </div>
      </div>`;
  }

  function bindCatModal() {
    document.querySelectorAll("[data-delcat]").forEach((b) => {
      b.onclick = async () => {
        const id = Number(b.dataset.delcat);
        const used = await DB.db.products.where("categoryId").equals(id).count();
        if (used > 0) { App.toast("Kategori dipakai produk, tidak bisa dihapus", false); return; }
        await DB.db.categories.delete(id);
        App.closeModal(); App.route(); App.toast("Kategori dihapus");
      };
    });
    document.getElementById("c-add").onclick = async () => {
      const name = document.getElementById("c-new").value.trim();
      if (!name) return;
      await DB.db.categories.add({ name, createdAt: DB.nowIso() });
      App.closeModal(); App.route(); App.toast("Kategori ditambahkan");
    };
  }

  async function render() {
    await load();
    const ql = q.toLowerCase();
    const list = products.filter((p) =>
      !ql || p.name.toLowerCase().includes(ql) || (p.sku || "").toLowerCase().includes(ql));
    const lowCount = products.filter((p) => p.isActive && p.stock <= (p.minStock || 5)).length;

    return `
      <div class="page-head">
        <div><h2>Produk</h2><div class="sub">${products.length} produk · ${lowCount} stok menipis</div></div>
        <div class="spacer"></div>
        <button class="btn btn-ghost" id="btn-cats">Kategori</button>
        <button class="btn btn-primary" id="btn-add">${icon('plus', 15)} Tambah Produk</button>
      </div>
      <div class="search" style="margin:0 0 16px;max-width:420px">
        ${icon('search', 18)}
        <input id="pq" placeholder="Cari produk…" value="${App.esc(q)}">
      </div>
      ${lowCount > 0 ? `<div class="card" style="margin-bottom:16px;border-color:#fcd34d;background:#fffbeb">
        <b style="display:inline-flex;align-items:center;gap:6px">${icon('alert', 16)} ${lowCount} produk stok menipis</b>
        <span style="color:var(--muted);font-size:13px"> — segera restock: ${
          products.filter((p) => p.isActive && p.stock <= (p.minStock || 5))
            .slice(0, 5).map((p) => App.esc(p.name)).join(", ")}</span></div>` : ""}
      <div class="tbl-wrap"><div class="tbl-scroll"><table class="tbl">
        <thead><tr><th>Produk</th><th>Kategori</th><th>Harga Jual</th><th>Stok</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${list.map((p) => `
            <tr>
              <td><b>${App.esc(p.name)}</b><br><span style="color:var(--muted);font-size:12px">${App.esc(p.sku || p.barcode || "—")}</span></td>
              <td>${App.esc(catName(p.categoryId))}</td>
              <td class="num"><b>${App.rupiah(p.sellPrice)}</b></td>
              <td>${p.stock <= (p.minStock || 5)
                ? `<span class="pill amber">${p.stock} (menipis)</span>`
                : `<span class="num">${p.stock}</span>`}</td>
              <td>${p.isActive ? `<span class="pill green">Aktif</span>` : `<span class="pill gray">Nonaktif</span>`}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-ghost btn-sm" data-barcode="${p.id}">${icon('scan', 14)} Barcode</button>
                <button class="btn btn-ghost btn-sm" data-edit="${p.id}">${icon('pencil', 14)} Ubah</button>
                <button class="btn ${p.isActive ? "btn-danger" : "btn-ghost"} btn-sm" data-toggle="${p.id}">
                  ${p.isActive ? "Nonaktifkan" : "Aktifkan"}</button>
              </td>
            </tr>`).join("") || `<tr><td colspan="6"><div class="empty">Tidak ada produk.</div></td></tr>`}
        </tbody>
      </table></div></div>`;
  }

  // bind via event delegation setelah render (dipanggil dari route wrapper)
  function bind() {
    document.getElementById("btn-add").onclick = () => {
      App.openModal(formHtml());
      document.getElementById("f-save").onclick = () => saveForm(null);
    };
    document.getElementById("btn-cats").onclick = () => {
      App.openModal(catFormHtml()); bindCatModal();
    };
    document.getElementById("pq").addEventListener("input", (e) => {
      q = e.target.value;
      clearTimeout(window.__pqT);
      window.__pqT = setTimeout(() => App.route(), 350);
    });
    document.querySelectorAll("[data-barcode]").forEach((b) =>
      b.onclick = () => BarcodeLabel.open(Number(b.dataset.barcode)));
    document.querySelectorAll("[data-edit]").forEach((b) =>
      b.onclick = async () => {
        const p = await DB.db.products.get(Number(b.dataset.edit));
        App.openModal(formHtml(p));
        document.getElementById("f-save").onclick = () => saveForm(p.id);
      });
    document.querySelectorAll("[data-toggle]").forEach((b) =>
      b.onclick = async () => {
        const id = Number(b.dataset.toggle);
        const p = await DB.db.products.get(id);
        await DB.db.products.update(id, { isActive: p.isActive ? 0 : 1, updatedAt: DB.nowIso() });
        App.toast(p.isActive ? "Produk dinonaktifkan" : "Produk diaktifkan");
        App.route();
      });
  }

  async function renderWithBind() {
    const html = await render();
    setTimeout(bind, 0);
    return html;
  }

  return { render: renderWithBind };
})();

</script>
<script>
/* === js/transactions.js === */
/* KasirKu — riwayat transaksi, pembatalan, retur */
const Transactions = (() => {
  let list = [];
  let filterDate = ""; // yyyy-mm-dd

  async function load() {
    let all = await DB.db.transactions.orderBy("createdAt").reverse().toArray();
    if (filterDate) {
      const s = new Date(filterDate + "T00:00:00").toISOString();
      const e = new Date(filterDate + "T23:59:59").toISOString();
      all = all.filter((t) => t.createdAt >= s && t.createdAt <= e);
    }
    list = all.slice(0, 200);
  }

  function statusPill(s) {
    return s === "COMPLETED"
      ? `<span class="pill green">Selesai</span>`
      : `<span class="pill red">Dibatalkan</span>`;
  }

  async function render() {
    await load();
    const total = list.filter((t) => t.status === "COMPLETED")
      .reduce((a, t) => a + t.total, 0);
    return `
      <div class="page-head">
        <div><h2>Transaksi</h2><div class="sub">${list.length} transaksi · total <b class="num">${App.rupiah(total)}</b></div></div>
        <div class="spacer"></div>
        <input type="date" id="f-date" value="${filterDate}" style="border:1.5px solid var(--line);border-radius:12px;padding:10px 14px">
        ${filterDate ? `<button class="btn btn-ghost btn-sm" id="f-clear">Reset</button>` : ""}
      </div>
      <div class="tbl-wrap"><div class="tbl-scroll"><table class="tbl">
        <thead><tr><th>No. Struk</th><th>Waktu</th><th>Metode</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${list.map((t) => `
            <tr class="clickable" data-detail="${t.id}">
              <td><b>${App.esc(t.number)}</b></td>
              <td>${App.fmtDateTime(t.date)}</td>
              <td>${App.esc(t.paymentMethod || "Tunai")}</td>
              <td class="num"><b>${App.rupiah(t.total)}</b></td>
              <td>${statusPill(t.status)}</td>
              <td><button class="btn btn-ghost btn-sm" data-detail="${t.id}">Detail ${icon('chevRight', 14)}</button></td>
            </tr>`).join("") || `<tr><td colspan="6"><div class="empty">Belum ada transaksi.</div></td></tr>`}
        </tbody>
      </table></div></div>`;
  }

  function bind() {
    const fd = document.getElementById("f-date");
    if (fd) fd.onchange = () => { filterDate = fd.value; App.route(); };
    const fc = document.getElementById("f-clear");
    if (fc) fc.onclick = () => { filterDate = ""; App.route(); };
    document.querySelectorAll("[data-detail]").forEach((el) =>
      el.addEventListener("click", (e) => { e.stopPropagation(); showDetail(Number(el.dataset.detail)); }));
  }

  async function showDetail(id) {
    const tx = await DB.db.transactions.get(id);
    if (!tx) return;
    const items = await DB.db.transaction_items.where("transactionId").equals(id).toArray();
    const returns = await DB.db.sales_returns.where("transactionId").equals(id).toArray();
    const returnedByItem = {};
    returns.forEach((r) => { returnedByItem[r.transactionItemId] = (returnedByItem[r.transactionItemId] || 0) + r.qty; });
    const totalRefund = returns.reduce((a, r) => a + r.refundAmount, 0);

    const itemRows = items.map((it) => {
      const ret = returnedByItem[it.id] || 0;
      const avail = it.qty - ret;
      return `<tr>
        <td><b>${App.esc(it.productName)}</b><br>
          <span style="color:var(--muted);font-size:12px" class="num">${it.qty} x ${App.rupiah(it.price)}${ret ? ` · retur ${ret}` : ""}</span></td>
        <td class="num" style="text-align:right"><b>${App.rupiah(it.subtotal)}</b></td>
        <td>${tx.status === "COMPLETED" && avail > 0
          ? `<input type="number" min="0" max="${avail}" value="0" data-retqty="${it.id}"
               style="width:70px;border:1.5px solid var(--line);border-radius:9px;padding:7px">`
          : `<span style="color:var(--muted);font-size:12px">—</span>`}</td>
      </tr>`;
    }).join("");

    App.openModal(`
      <div class="modal-head"><h3>Detail Transaksi</h3>
        <button class="modal-x" onclick="App.closeModal()">${icon('x', 16)}</button></div>
      <div class="modal-body">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <b>${App.esc(tx.number)}</b>${statusPill(tx.status)}
        </div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:12px">
          ${App.fmtDateTime(tx.date)} · ${App.esc(tx.paymentMethod || "Tunai")} · ${App.esc(tx.orderType || "")}
        </div>
        <table class="tbl" style="min-width:0">
          <thead><tr><th>Item</th><th style="text-align:right">Subtotal</th><th>Retur</th></tr></thead>
          <tbody>${itemRows}</tbody>
        </table>
        <div class="totals" style="border:1px solid var(--line);border-radius:14px;margin-top:12px">
          <div class="trow"><span>Subtotal</span><span class="num">${App.rupiah(tx.subtotal)}</span></div>
          <div class="trow"><span>Diskon</span><span class="num">${App.rupiah(tx.discount)}</span></div>
          <div class="trow grand"><span>Total</span><span class="num">${App.rupiah(tx.total)}</span></div>
          <div class="trow"><span>Bayar</span><span class="num">${App.rupiah(tx.paid)}</span></div>
          <div class="trow"><span>Kembali</span><span class="num">${App.rupiah(tx.change)}</span></div>
          ${totalRefund ? `<div class="trow disc"><span>Total diretur</span><span class="num">−${App.rupiah(totalRefund)}</span></div>` : ""}
        </div>
        ${tx.status === "COMPLETED" ? `
        <div class="field" style="margin-top:14px"><label>Alasan retur (opsional)</label>
          <input id="ret-reason" placeholder="cth: barang cacat"></div>
        <div class="row2">
          <button class="btn btn-primary" id="d-retur" style="flex:2">${icon('receipt', 15)} Proses Retur</button>
          <button class="btn btn-danger" id="d-batal" style="flex:1">${icon('x', 15)} Batalkan</button>
        </div>` : ""}
      </div>`);

    const bBatal = document.getElementById("d-batal");
    if (bBatal) bBatal.onclick = () => cancelTx(tx);
    const bRetur = document.getElementById("d-retur");
    if (bRetur) bRetur.onclick = () => processReturn(tx, items, returnedByItem);
  }

  async function cancelTx(tx) {
    if (!confirm(`Batalkan transaksi ${tx.number}? Stok akan dikembalikan.`)) return;
    const now = DB.nowIso();
    await DB.db.transaction("rw",
      DB.db.transactions, DB.db.transaction_items,
      DB.db.products, DB.db.stock_movements,
      async () => {
        const cur = await DB.db.transactions.get(tx.id);
        if (!cur || cur.status !== "COMPLETED") throw new Error("Transaksi sudah dibatalkan.");
        await DB.db.transactions.update(tx.id, { status: "CANCELLED" });
        const items = await DB.db.transaction_items.where("transactionId").equals(tx.id).toArray();
        for (const it of items) {
          if (!it.productId) continue;
          const p = await DB.db.products.get(it.productId);
          if (!p) continue;
          const before = p.stock, after = before + it.qty;
          await DB.db.products.update(p.id, { stock: after, updatedAt: now });
          await DB.db.stock_movements.add({
            productId: p.id, type: "STOCK_IN", quantity: it.qty,
            stockBefore: before, stockAfter: after,
            referenceType: "transaction_cancel", referenceId: tx.id,
            note: `Pembatalan ${tx.number}`, createdAt: now,
          });
        }
      }).catch((e) => { App.toast(e.message, false); throw e; });
    App.closeModal();
    App.toast("Transaksi dibatalkan, stok dikembalikan");
    App.route();
  }

  async function processReturn(tx, items, returnedByItem) {
    const lines = [];
    for (const it of items) {
      const inp = document.querySelector(`[data-retqty="${it.id}"]`);
      const qty = Math.max(0, Number(inp?.value) || 0);
      const avail = it.qty - (returnedByItem[it.id] || 0);
      if (qty > avail) {
        App.toast(`Qty retur "${it.productName}" melebihi sisa (${avail})`, false);
        return;
      }
      if (qty > 0) lines.push({ item: it, qty });
    }
    if (lines.length === 0) { App.toast("Isi qty retur dulu", false); return; }
    const reason = (document.getElementById("ret-reason")?.value || "").trim();
    const now = DB.nowIso();
    let totalRefund = 0;

    await DB.db.transaction("rw",
      DB.db.sales_returns, DB.db.products, DB.db.stock_movements,
      async () => {
        for (const { item, qty } of lines) {
          // validasi ulang akumulasi di dalam transaksi
          const prior = await DB.db.sales_returns
            .where("transactionItemId").equals(item.id).toArray();
          const already = prior.reduce((a, r) => a + r.qty, 0);
          if (already + qty > item.qty) {
            throw new Error(`Qty retur "${item.productName}" melebihi yang terjual.`);
          }
          const refund = Math.round((item.subtotal / item.qty) * qty);
          const p = item.productId ? await DB.db.products.get(item.productId) : null;
          await DB.db.sales_returns.add({
            transactionId: tx.id, transactionItemId: item.id,
            productId: item.productId || null, qty, refundAmount: refund,
            reason, createdAt: now,
          });
          totalRefund += refund;
          if (p) {
            const before = p.stock, after = before + qty;
            await DB.db.products.update(p.id, { stock: after, updatedAt: now });
            await DB.db.stock_movements.add({
              productId: p.id, type: "RETURN", quantity: qty,
              stockBefore: before, stockAfter: after,
              referenceType: "sales_return", referenceId: tx.id,
              note: `Retur ${tx.number}${reason ? ": " + reason : ""}`,
              createdAt: now,
            });
          }
        }
      }).catch((e) => { App.toast(e.message, false); throw e; });

    App.closeModal();
    App.toast(`Retur berhasil · refund ${App.rupiah(totalRefund)}`);
    App.route();
  }

  async function renderWithBind() {
    const html = await render();
    setTimeout(bind, 0);
    return html;
  }
  return { render: renderWithBind };
})();

</script>
<script>
/* === js/reports.js === */
/* KasirKu — laporan netto (retur mengurangi omzet/HPP/item) */
const Reports = (() => {
  let period = "today"; // today | 7d | 30d

  function range() {
    const end = new Date(); end.setHours(23, 59, 59, 999);
    const start = new Date();
    if (period === "today") start.setHours(0, 0, 0, 0);
    else if (period === "7d") { start.setDate(start.getDate() - 6); start.setHours(0, 0, 0, 0); }
    else { start.setDate(start.getDate() - 29); start.setHours(0, 0, 0, 0); }
    return { start: start.toISOString(), end: end.toISOString(), startD: start };
  }

  async function summary() {
    const { start, end } = range();
    const txs = (await DB.db.transactions
      .where("createdAt").between(start, end, true, true).toArray())
      .filter((t) => t.status === "COMPLETED");
    const txIds = new Set(txs.map((t) => t.id));
    let items = [];
    if (txIds.size) {
      items = await DB.db.transaction_items.toArray()
        .then((rows) => rows.filter((r) => txIds.has(r.transactionId)));
    }
    const rets = await DB.db.sales_returns
      .where("createdAt").between(start, end, true, true).toArray();

    let revenue = 0, soldQty = 0, hpp = 0;
    for (const t of txs) revenue += t.total;
    for (const it of items) { soldQty += it.qty; hpp += (it.costPrice || 0) * it.qty; }

    let refund = 0, retQty = 0, retHpp = 0;
    const itemById = new Map(items.map((i) => [i.id, i]));
    for (const r of rets) {
      refund += r.refundAmount; retQty += r.qty;
      const it = itemById.get(r.transactionItemId);
      if (it) retHpp += (it.costPrice || 0) * r.qty;
      else {
        // item dari transaksi di luar periode: HPP dari produk saat ini
        const p = r.productId ? await DB.db.products.get(r.productId) : null;
        if (p) retHpp += (p.costPrice || 0) * r.qty;
      }
    }
    const expenses = await DB.db.expenses
      .where("date").between(start, end, true, true).toArray();
    const expTotal = expenses.reduce((a, e) => a + e.amount, 0);

    const netRevenue = revenue - refund;
    const netHpp = hpp - retHpp;
    return {
      revenue: netRevenue, itemsSold: soldQty - retQty, hpp: netHpp,
      grossProfit: netRevenue - netHpp,
      expenses: expTotal, netProfit: netRevenue - netHpp - expTotal,
      totalRefund: refund, returnCount: rets.length,
      txCount: txs.length,
    };
  }

  async function perProduct() {
    const { start, end } = range();
    const txs = (await DB.db.transactions
      .where("createdAt").between(start, end, true, true).toArray())
      .filter((t) => t.status === "COMPLETED");
    const txIds = new Set(txs.map((t) => t.id));
    const items = txIds.size
      ? (await DB.db.transaction_items.toArray()).filter((r) => txIds.has(r.transactionId))
      : [];
    const rets = await DB.db.sales_returns
      .where("createdAt").between(start, end, true, true).toArray();

    const map = new Map();
    const agg = (pid, name, qty, rev, h) => {
      if (!map.has(pid)) map.set(pid, { productId: pid, name, qty: 0, revenue: 0, hpp: 0, retQty: 0 });
      const r = map.get(pid);
      r.qty += qty; r.revenue += rev; r.hpp += h;
    };
    for (const it of items) {
      agg(it.productId, it.productName, it.qty, it.subtotal, (it.costPrice || 0) * it.qty);
    }
    const itemById = new Map(items.map((i) => [i.id, i]));
    for (const r of rets) {
      const it = itemById.get(r.transactionItemId);
      const name = it ? it.productName : (r.productId
        ? (await DB.db.products.get(r.productId))?.name || "Produk" : "Produk");
      const pid = it ? it.productId : r.productId;
      const hppPer = it ? (it.costPrice || 0) : 0;
      if (!map.has(pid)) map.set(pid, { productId: pid, name, qty: 0, revenue: 0, hpp: 0, retQty: 0 });
      const row = map.get(pid);
      row.retQty += r.qty;
      row.qty -= r.qty;
      row.revenue -= r.refundAmount;
      row.hpp -= hppPer * r.qty;
    }
    return [...map.values()]
      .map((r) => ({ ...r, profit: r.revenue - r.hpp }))
      .sort((a, b) => b.revenue - a.revenue);
  }

  async function dailySeries() {
    // 7 hari terakhir: omzet netto per hari
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      days.push(d);
    }
    const out = [];
    for (const d of days) {
      const s = new Date(d); s.setHours(0, 0, 0, 0);
      const e = new Date(d); e.setHours(23, 59, 59, 999);
      const txs = (await DB.db.transactions
        .where("createdAt").between(s.toISOString(), e.toISOString(), true, true).toArray())
        .filter((t) => t.status === "COMPLETED");
      const rets = await DB.db.sales_returns
        .where("createdAt").between(s.toISOString(), e.toISOString(), true, true).toArray();
      const rev = txs.reduce((a, t) => a + t.total, 0);
      const ref = rets.reduce((a, r) => a + r.refundAmount, 0);
      out.push({ label: `${s.getDate()}/${s.getMonth() + 1}`, value: rev - ref });
    }
    return out;
  }

  function drawChart(canvas, data) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);
    const max = Math.max(...data.map((d) => d.value), 1);
    const padL = 8, padB = 26, padT = 14;
    const cw = W - padL * 2, ch = H - padB - padT;
    const px = (i) => padL + (cw * i) / Math.max(1, data.length - 1);
    const py = (v) => padT + ch - (ch * v) / max;

    // area
    const grad = ctx.createLinearGradient(0, padT, 0, padT + ch);
    grad.addColorStop(0, "rgba(5,150,105,.28)");
    grad.addColorStop(1, "rgba(5,150,105,0)");
    ctx.beginPath();
    data.forEach((d, i) => (i === 0 ? ctx.moveTo(px(i), py(d.value)) : ctx.lineTo(px(i), py(d.value))));
    ctx.lineTo(px(data.length - 1), padT + ch);
    ctx.lineTo(px(0), padT + ch);
    ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    // garis
    ctx.beginPath();
    data.forEach((d, i) => (i === 0 ? ctx.moveTo(px(i), py(d.value)) : ctx.lineTo(px(i), py(d.value))));
    ctx.strokeStyle = "#059669"; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.stroke();

    // titik + label
    ctx.font = "10px 'Plus Jakarta Sans', sans-serif";
    ctx.fillStyle = "#78716c"; ctx.textAlign = "center";
    data.forEach((d, i) => {
      ctx.beginPath(); ctx.arc(px(i), py(d.value), 3.5, 0, 7);
      ctx.fillStyle = "#059669"; ctx.fill();
      ctx.fillStyle = "#78716c";
      ctx.fillText(d.label, px(i), H - 8);
    });
  }

  const PERIODS = [["today", "Hari ini"], ["7d", "7 hari"], ["30d", "30 hari"]];

  async function render() {
    const s = await summary();
    const rows = await perProduct();
    const series = await dailySeries();
    return `
      <div class="page-head">
        <div><h2>Laporan</h2><div class="sub">Angka netto (sudah dikurangi retur)</div></div>
        <div class="spacer"></div>
        <div class="rep-actions no-print">
          <div class="cats" style="margin:0">${PERIODS.map(([k, l]) =>
            `<button class="cat ${period === k ? "active" : ""}" data-per="${k}">${l}</button>`).join("")}</div>
          <button class="btn-line" id="rep-xls">${icon('download', 15)} Excel</button>
          <button class="btn-line" id="rep-print">${icon('printer', 15)} Cetak / PDF</button>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="l">Omzet (netto)</div><div class="v green num">${App.rupiah(s.revenue)}</div></div>
        <div class="stat"><div class="l">HPP (netto)</div><div class="v num">${App.rupiah(s.hpp)}</div></div>
        <div class="stat"><div class="l">Laba Kotor</div><div class="v green num">${App.rupiah(s.grossProfit)}</div></div>
        <div class="stat"><div class="l">Pengeluaran</div><div class="v red num">${App.rupiah(s.expenses)}</div></div>
        <div class="stat"><div class="l">Laba Bersih</div><div class="v ${s.netProfit >= 0 ? "green" : "red"} num">${App.rupiah(s.netProfit)}</div></div>
        <div class="stat"><div class="l">Total Retur</div><div class="v amber num">${App.rupiah(s.totalRefund)}</div></div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <b>Omzet 7 hari terakhir (netto)</b>
        <canvas id="rev-chart" style="width:100%;height:220px;margin-top:10px"></canvas>
      </div>
      <div class="tbl-wrap"><div class="tbl-scroll"><table class="tbl">
        <thead><tr><th>Produk</th><th>Qty (netto)</th><th>Omzet</th><th>HPP</th><th>Laba</th></tr></thead>
        <tbody>
          ${rows.map((r) => `
            <tr><td><b>${App.esc(r.name)}</b>${r.retQty ? ` <span class="pill amber">${r.retQty} retur</span>` : ""}</td>
              <td class="num">${r.qty}</td><td class="num">${App.rupiah(r.revenue)}</td>
              <td class="num">${App.rupiah(r.hpp)}</td>
              <td class="num"><b style="color:${r.profit >= 0 ? "var(--emerald-dark)" : "var(--red-dark)"}">${App.rupiah(r.profit)}</b></td>
            </tr>`).join("") || `<tr><td colspan="5"><div class="empty">Belum ada penjualan di periode ini.</div></td></tr>`}
        </tbody>
      </table></div></div>`;
  }

  function bind() {
    document.querySelectorAll("[data-per]").forEach((b) =>
      b.onclick = () => { period = b.dataset.per; App.route(); });
    const csvBtn = document.getElementById("rep-xls");
    if (csvBtn) csvBtn.onclick = exportExcel;
    const prBtn = document.getElementById("rep-print");
    if (prBtn) prBtn.onclick = () => window.print();
    const c = document.getElementById("rev-chart");
    if (c) {
      // tunggu layout
      requestAnimationFrame(async () => {
        const series = await dailySeries();
        drawChart(c, series);
      });
    }
  }

  // ---------- unduh Excel (.xls SpreadsheetML — rapi di semua aplikasi) ----------
  function xmlEsc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function exportExcel() {
    const s = await summary();
    const rows = await perProduct();
    const { startD } = range();
    const endD = new Date();
    const store = await DB.getSetting("storeName", "Toko Saya");
    const perLabel = period === "today" ? "Hari ini" : period === "7d" ? "7 hari terakhir" : "30 hari terakhir";
    const R = [];
    const row = (cells) => "<Row>" + cells.map((c) =>
      `<Cell><Data ss:Type="${typeof c === "number" ? "Number" : "String"}">${xmlEsc(c)}</Data></Cell>`).join("") + "</Row>";
    R.push(row([`Laporan Penjualan - ${store}`]));
    R.push(row([`Periode: ${perLabel} (${App.fmtDate(startD.toISOString())} s/d ${App.fmtDate(endD.toISOString())})`]));
    R.push("<Row/>");
    R.push(row(["RINGKASAN"]));
    R.push(row(["Omzet (netto)", s.revenue]));
    R.push(row(["HPP (netto)", s.hpp]));
    R.push(row(["Laba Kotor", s.grossProfit]));
    R.push(row(["Pengeluaran", s.expenses]));
    R.push(row(["Laba Bersih", s.netProfit]));
    R.push(row(["Total Retur", s.totalRefund]));
    R.push(row(["Jumlah Transaksi", s.txCount]));
    R.push("<Row/>");
    R.push(row(["DETAIL PRODUK"]));
    R.push(row(["Produk", "Qty (netto)", "Omzet (Rp)", "HPP (Rp)", "Laba (Rp)", "Qty Retur"]));
    for (const r of rows) {
      R.push(row([r.name, r.qty, r.revenue, r.hpp, r.profit, r.retQty || 0]));
    }
    const xml =
      `<?xml version="1.0" encoding="UTF-8"?>\n` +
      `<?mso-application progid="Excel.Sheet"?>\n` +
      `<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ` +
      `xmlns:o="urn:schemas-microsoft-com:office:office" ` +
      `xmlns:x="urn:schemas-microsoft-com:office:excel" ` +
      `xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n` +
      `<Worksheet ss:Name="Laporan"><Table>\n` +
      `<Column ss:Width="240"/><Column ss:Width="110"/><Column ss:Width="110"/>` +
      `<Column ss:Width="110"/><Column ss:Width="110"/><Column ss:Width="110"/>\n` +
      R.join("\n") + `\n</Table></Worksheet>\n</Workbook>`;
    const blob = new Blob(["\uFEFF" + xml], { type: "application/vnd.ms-excel;charset=utf-8" });
    const a = document.createElement("a");
    const stamp = startD.toISOString().slice(0, 10).replace(/-/g, "") + "_" + endD.toISOString().slice(0, 10).replace(/-/g, "");
    a.href = URL.createObjectURL(blob);
    a.download = `laporan_penjualan_${stamp}.xls`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    App.toast("Laporan Excel diunduh");
  }


  async function renderWithBind() {
    const html = await render();
    setTimeout(bind, 0);
    return html;
  }
  return { render: renderWithBind };
})();

</script>
<script>
/* === js/stock.js === */
/* KasirKu — stok: tambah/kurang, opname, riwayat movement */
const Stock = (() => {
  let products = [];
  let q = "";

  const TYPE_LABEL = {
    INITIAL: "Stok awal", STOCK_IN: "Masuk", STOCK_OUT: "Keluar",
    ADJUSTMENT: "Opname", RETURN: "Retur",
  };
  const TYPE_PILL = {
    INITIAL: "gray", STOCK_IN: "green", STOCK_OUT: "red",
    ADJUSTMENT: "amber", RETURN: "amber",
  };

  async function load() {
    products = await DB.db.products.orderBy("name").toArray();
  }

  async function move(productId, type, qty, note, refType = null, refId = null) {
    const now = DB.nowIso();
    await DB.db.transaction("rw", DB.db.products, DB.db.stock_movements, async () => {
      const p = await DB.db.products.get(productId);
      if (!p) throw new Error("Produk tidak ditemukan");
      const before = p.stock;
      let after;
      if (type === "STOCK_IN") after = before + qty;
      else if (type === "STOCK_OUT") {
        if (qty > before) throw new Error(`Stok tidak mencukupi (tersedia ${before})`);
        after = before - qty;
      }
      await DB.db.products.update(productId, { stock: after, updatedAt: now });
      await DB.db.stock_movements.add({
        productId, type, quantity: qty, stockBefore: before, stockAfter: after,
        referenceType: refType, referenceId: refId, note, createdAt: now,
      });
    });
  }

  function moveFormHtml(p, mode) {
    const isIn = mode === "in";
    return `
      <div class="modal-head"><h3>${isIn ? "Tambah" : "Kurangi"} Stok</h3>
        <button class="modal-x" onclick="App.closeModal()">${icon('x', 16)}</button></div>
      <div class="modal-body">
        <p style="margin-bottom:12px"><b>${App.esc(p.name)}</b> · stok saat ini: <b class="num">${p.stock}</b></p>
        <div class="field"><label>Jumlah</label>
          <input id="mv-qty" type="number" min="1" value="1"></div>
        <div class="field"><label>Catatan</label>
          <input id="mv-note" placeholder="cth: restock supplier"></div>
        <button class="btn btn-primary" style="width:100%" id="mv-save">Simpan</button>
      </div>`;
  }

  function opnameFormHtml(p) {
    return `
      <div class="modal-head"><h3>Stok Opname</h3>
        <button class="modal-x" onclick="App.closeModal()">${icon('x', 16)}</button></div>
      <div class="modal-body">
        <p style="margin-bottom:12px"><b>${App.esc(p.name)}</b></p>
        <div class="trow"><span>Stok sistem</span><b class="num">${p.stock}</b></div>
        <div class="field" style="margin-top:12px"><label>Stok fisik (hasil hitungan)</label>
          <input id="op-phys" type="number" min="0" value="${p.stock}"></div>
        <div class="field"><label>Alasan</label>
          <input id="op-reason" placeholder="cth: selisih gudang"></div>
        <button class="btn btn-primary" style="width:100%" id="op-save">Sesuaikan</button>
      </div>`;
  }

  async function historyHtml(productId) {
    const rows = await DB.db.stock_movements
      .where("productId").equals(productId).reverse().toArray();
    const list = rows.slice(0, 50);
    return `
      <div class="modal-head"><h3>Riwayat Stok</h3>
        <button class="modal-x" onclick="App.closeModal()">${icon('x', 16)}</button></div>
      <div class="modal-body">
        ${list.map((m) => `
          <div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px">
            <div><span class="pill ${TYPE_PILL[m.type] || "gray"}">${TYPE_LABEL[m.type] || m.type}</span>
              <div style="color:var(--muted);font-size:12px;margin-top:4px">${App.esc(m.note || "")}<br>${App.fmtDateTime(m.createdAt)}</div></div>
            <div class="num" style="text-align:right;white-space:nowrap">
              ${m.stockBefore} → <b>${m.stockAfter}</b><br>
              <span style="color:var(--muted)">(${m.quantity > 0 ? "+" : ""}${m.quantity})</span></div>
          </div>`).join("") || `<div class="empty">Belum ada pergerakan.</div>`}
      </div>`;
  }

  async function render() {
    await load();
    const ql = q.toLowerCase();
    const list = products.filter((p) => p.isActive &&
      (!ql || p.name.toLowerCase().includes(ql)));
    return `
      <div class="page-head">
        <div><h2>Stok</h2><div class="sub">${list.length} produk aktif</div></div>
        <div class="spacer"></div>
      </div>
      <div class="search" style="margin:0 0 16px;max-width:420px">
        ${icon('search', 18)}
        <input id="sq" placeholder="Cari produk…" value="${App.esc(q)}">
      </div>
      <div class="tbl-wrap"><div class="tbl-scroll"><table class="tbl">
        <thead><tr><th>Produk</th><th>Stok</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${list.map((p) => `
            <tr>
              <td><b>${App.esc(p.name)}</b></td>
              <td class="num"><b>${p.stock}</b> ${App.esc(p.unit || "pcs")}</td>
              <td>${p.stock === 0 ? `<span class="pill red">Habis</span>`
                : p.stock <= (p.minStock || 5) ? `<span class="pill amber">Menipis</span>`
                : `<span class="pill green">Aman</span>`}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-ghost btn-sm" data-min="${p.id}">${icon('minus', 14)}</button>
                <button class="btn btn-ghost btn-sm" data-pin="${p.id}">${icon('plus', 14)}</button>
                <button class="btn btn-ghost btn-sm" data-op="${p.id}">Opname</button>
                <button class="btn btn-ghost btn-sm" data-hist="${p.id}">Riwayat</button>
              </td>
            </tr>`).join("") || `<tr><td colspan="4"><div class="empty">Tidak ada produk.</div></td></tr>`}
        </tbody>
      </table></div></div>`;
  }

  function bind() {
    document.getElementById("sq").addEventListener("input", (e) => {
      q = e.target.value;
      clearTimeout(window.__sqT);
      window.__sqT = setTimeout(() => App.route(), 350);
    });
    const doMove = (id, mode) => {
      const p = products.find((x) => x.id === id);
      App.openModal(moveFormHtml(p, mode));
      document.getElementById("mv-save").onclick = async () => {
        const qty = Math.max(1, Number(document.getElementById("mv-qty").value) || 1);
        const note = document.getElementById("mv-note").value.trim();
        try {
          await move(id, mode === "in" ? "STOCK_IN" : "STOCK_OUT", qty, note || (mode === "in" ? "Penambahan stok" : "Pengurangan stok"));
          App.closeModal(); App.toast("Stok diperbarui"); App.route();
        } catch (e) { App.toast(e.message, false); }
      };
    };
    document.querySelectorAll("[data-pin]").forEach((b) => b.onclick = () => doMove(Number(b.dataset.pin), "in"));
    document.querySelectorAll("[data-min]").forEach((b) => b.onclick = () => doMove(Number(b.dataset.min), "out"));
    document.querySelectorAll("[data-op]").forEach((b) => b.onclick = async () => {
      const id = Number(b.dataset.op);
      const p = await DB.db.products.get(id);
      App.openModal(opnameFormHtml(p));
      document.getElementById("op-save").onclick = async () => {
        const phys = Number(document.getElementById("op-phys").value);
        if (phys < 0 || isNaN(phys)) { App.toast("Stok fisik tidak valid", false); return; }
        const reason = document.getElementById("op-reason").value.trim();
        const now = DB.nowIso();
        await DB.db.transaction("rw", DB.db.products, DB.db.stock_movements, async () => {
          const cur = await DB.db.products.get(id);
          const diff = phys - cur.stock;
          if (diff === 0) return;
          await DB.db.products.update(id, { stock: phys, updatedAt: now });
          await DB.db.stock_movements.add({
            productId: id, type: "ADJUSTMENT", quantity: Math.abs(diff),
            stockBefore: cur.stock, stockAfter: phys,
            referenceType: "stock_opname", referenceId: null,
            note: `Stok opname${reason ? ": " + reason : ""} (${diff > 0 ? "+" : ""}${diff})`,
            createdAt: now,
          });
        });
        App.closeModal(); App.toast("Opname disimpan"); App.route();
      };
    });
    document.querySelectorAll("[data-hist]").forEach((b) => b.onclick = async () => {
      App.openModal(await historyHtml(Number(b.dataset.hist)));
    });
  }

  async function renderWithBind() {
    const html = await render();
    setTimeout(bind, 0);
    return html;
  }
  return { render: renderWithBind };
})();

</script>
<script>
/* === js/expenses.js === */
/* KasirKu — pengeluaran */
const Expenses = (() => {
  let list = [];
  let month = ""; // yyyy-mm, "" = semua

  async function load() {
    let all = await DB.db.expenses.orderBy("date").reverse().toArray();
    if (month) all = all.filter((e) => (e.date || "").startsWith(month));
    list = all.slice(0, 200);
  }

  function formHtml(e = {}) {
    const d = e.date ? e.date.slice(0, 10) : new Date().toISOString().slice(0, 10);
    return `
      <div class="modal-head"><h3>${e.id ? "Ubah" : "Tambah"} Pengeluaran</h3>
        <button class="modal-x" onclick="App.closeModal()">${icon('x', 16)}</button></div>
      <div class="modal-body">
        <div class="field"><label>Kategori</label>
          <input id="e-cat" list="e-cats" value="${App.esc(e.category || "")}" placeholder="cth: Belanja, Listrik, Gaji">
          <datalist id="e-cats">
            <option value="Belanja"><option value="Listrik"><option value="Gaji">
            <option value="Sewa"><option value="Lainnya">
          </datalist></div>
        <div class="frow">
          <div class="field"><label>Jumlah (Rp)</label>
            <input id="e-amt" type="number" min="1" value="${e.amount || ""}"></div>
          <div class="field"><label>Tanggal</label>
            <input id="e-date" type="date" value="${d}"></div>
        </div>
        <div class="field"><label>Keterangan</label>
          <input id="e-desc" value="${App.esc(e.description || "")}" placeholder="opsional"></div>
        <button class="btn btn-primary" style="width:100%" id="e-save">Simpan</button>
      </div>`;
  }

  async function saveForm(id) {
    const category = document.getElementById("e-cat").value.trim();
    const amount = Math.max(0, Number(document.getElementById("e-amt").value) || 0);
    if (!category) { App.toast("Kategori wajib diisi", false); return; }
    if (amount <= 0) { App.toast("Jumlah harus lebih dari 0", false); return; }
    const date = new Date(document.getElementById("e-date").value + "T12:00:00").toISOString();
    const data = {
      category, amount,
      description: document.getElementById("e-desc").value.trim(),
      date, createdAt: DB.nowIso(),
    };
    if (id) { await DB.db.expenses.update(id, data); App.toast("Pengeluaran diperbarui"); }
    else { await DB.db.expenses.add(data); App.toast("Pengeluaran ditambahkan"); }
    App.closeModal(); App.route();
  }

  async function render() {
    await load();
    const total = list.reduce((a, e) => a + e.amount, 0);
    const months = [...new Set((await DB.db.expenses.toArray())
      .map((e) => (e.date || "").slice(0, 7)).filter(Boolean))].sort().reverse();
    return `
      <div class="page-head">
        <div><h2>Pengeluaran</h2><div class="sub">Total periode: <b class="num">${App.rupiah(total)}</b></div></div>
        <div class="spacer"></div>
        <select id="e-month" style="border:1.5px solid var(--line);border-radius:12px;padding:10px 14px">
          <option value="">Semua waktu</option>
          ${months.map((m) => `<option value="${m}" ${month === m ? "selected" : ""}>${m}</option>`).join("")}
        </select>
        <button class="btn btn-primary" id="e-add">${icon('plus', 15)} Tambah</button>
      </div>
      <div class="tbl-wrap"><div class="tbl-scroll"><table class="tbl">
        <thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th>Jumlah</th><th></th></tr></thead>
        <tbody>
          ${list.map((e) => `
            <tr><td>${App.fmtDate(e.date)}</td><td><b>${App.esc(e.category)}</b></td>
              <td style="color:var(--muted)">${App.esc(e.description || "—")}</td>
              <td class="num"><b>${App.rupiah(e.amount)}</b></td>
              <td style="white-space:nowrap">
                <button class="btn btn-ghost btn-sm" data-eedit="${e.id}">${icon('pencil', 14)} Ubah</button>
                <button class="btn btn-danger btn-sm" data-edel="${e.id}">${icon('trash', 14)} Hapus</button>
              </td></tr>`).join("") || `<tr><td colspan="5"><div class="empty">Belum ada pengeluaran.</div></td></tr>`}
        </tbody>
      </table></div></div>`;
  }

  function bind() {
    document.getElementById("e-add").onclick = () => {
      App.openModal(formHtml());
      document.getElementById("e-save").onclick = () => saveForm(null);
    };
    document.getElementById("e-month").onchange = (e) => { month = e.target.value; App.route(); };
    document.querySelectorAll("[data-eedit]").forEach((b) =>
      b.onclick = async () => {
        const e = await DB.db.expenses.get(Number(b.dataset.eedit));
        App.openModal(formHtml(e));
        document.getElementById("e-save").onclick = () => saveForm(e.id);
      });
    document.querySelectorAll("[data-edel]").forEach((b) =>
      b.onclick = async () => {
        if (!confirm("Hapus pengeluaran ini?")) return;
        await DB.db.expenses.delete(Number(b.dataset.edel));
        App.toast("Pengeluaran dihapus"); App.route();
      });
  }

  async function renderWithBind() {
    const html = await render();
    setTimeout(bind, 0);
    return html;
  }
  return { render: renderWithBind };
})();

</script>
<script>
/* === js/backup.js === */
/* KasirKu — backup: export/import JSON + Google Drive (GIS + Drive API) */
const Backup = (() => {
  const TABLES = ["products", "categories", "transactions", "transaction_items",
    "expenses", "stock_movements", "sales_returns", "settings"];

  async function exportData() {
    const data = { app: "KasirKu", version: 1, exportedAt: DB.nowIso(), tables: {} };
    for (const t of TABLES) data.tables[t] = await DB.db.table(t).toArray();
    return data;
  }

  function download(filename, text) {
    const blob = new Blob([text], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  async function exportJson() {
    const data = await exportData();
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}_${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}`;
    download(`kasirku_backup_${stamp}.json`, JSON.stringify(data));
    App.toast("Backup JSON diunduh");
  }

  async function importJson(file) {
    const text = await file.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error("File bukan JSON yang valid."); }
    if (!data.tables || data.app !== "KasirKu") {
      throw new Error("File bukan backup KasirKu yang valid.");
    }
    if (!confirm("Import akan MENGGANTI seluruh data saat ini. Lanjutkan?")) return;
    await DB.db.transaction("rw", DB.db.tables, async () => {
      for (const t of TABLES) await DB.db.table(t).clear();
      for (const t of TABLES) {
        const rows = data.tables[t] || [];
        if (rows.length) await DB.db.table(t).bulkAdd(rows);
      }
    });
    App.toast("Restore dari JSON berhasil");
    App.route();
  }

  // ---------- Google Drive ----------
  let gisLoaded = false;
  let tokenClient = null;
  let accessToken = null;

  function loadGis() {
    return new Promise((resolve, reject) => {
      if (gisLoaded) return resolve();
      if (!navigator.onLine) return reject(new Error("Butuh koneksi internet untuk memuat login Google."));
      const s = document.createElement("script");
      s.src = "https://accounts.google.com/gsi/client";
      s.onload = () => { gisLoaded = true; resolve(); };
      s.onerror = () => reject(new Error("Gagal memuat Google Identity Services."));
      document.head.appendChild(s);
    });
  }

  async function getClientId() {
    const id = await DB.getSetting("googleClientId", "");
    if (!id) throw new Error("Client ID Google belum diisi. Lihat PANDUAN_DRIVE.md");
    return id;
  }

  async function signIn() {
    await loadGis();
    const clientId = await getClientId();
    return new Promise((resolve, reject) => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: "https://www.googleapis.com/auth/drive.appdata",
        callback: (resp) => {
          if (resp.access_token) { accessToken = resp.access_token; resolve(accessToken); }
          else reject(new Error("Login Google dibatalkan."));
        },
      });
      tokenClient.requestAccessToken({ prompt: "consent" });
    });
  }

  async function driveFetch(path, opts = {}) {
    if (!accessToken) await signIn();
    const doFetch = async (token) => fetch(`https://www.googleapis.com${path}`, {
      ...opts,
      headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` },
    });
    let res = await doFetch(accessToken);
    if (res.status === 401) { // token kadaluarsa → login ulang
      accessToken = null;
      await signIn();
      res = await doFetch(accessToken);
    }
    return res;
  }

  async function backupToDrive(onProgress) {
    onProgress && onProgress("Menyiapkan data…");
    const data = await exportData();
    const json = JSON.stringify(data);
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}_${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}`;
    const name = `kasirku_backup_${stamp}.json`;

    onProgress && onProgress("Menghubungkan Google…");
    await signIn();

    onProgress && onProgress("Mengupload ke Drive…");
    // 1. init resumable upload ke appDataFolder
    const meta = { name, parents: ["appDataFolder"], mimeType: "application/json" };
    const init = await driveFetch("/upload/drive/v3/files?uploadType=resumable", {
      method: "POST",
      headers: { "Content-Type": "application/json; charset=UTF-8" },
      body: JSON.stringify(meta),
    });
    if (!init.ok) throw new Error("Gagal memulai upload (" + init.status + ")");
    const sessionUrl = init.headers.get("location");
    // 2. upload konten
    const put = await fetch(sessionUrl, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: json,
    });
    if (!put.ok) throw new Error("Upload gagal (" + put.status + ")");
    onProgress && onProgress("Selesai: " + name);
    return name;
  }

  async function restoreFromDrive(onProgress) {
    onProgress && onProgress("Menghubungkan Google…");
    await signIn();
    onProgress && onProgress("Mencari backup terbaru…");
    const q = encodeURIComponent(
      "'appDataFolder' in parents and name contains 'kasirku_backup_' and trashed = false");
    const res = await driveFetch(
      `/drive/v3/files?q=${q}&orderBy=createdTime desc&pageSize=1&fields=files(id,name,createdTime)`);
    if (!res.ok) throw new Error("Gagal membaca Drive (" + res.status + ")");
    const files = (await res.json()).files || [];
    if (!files.length) throw new Error("Tidak ada backup KasirKu di Google Drive.");
    const f = files[0];
    onProgress && onProgress("Mengunduh " + f.name + "…");
    const dl = await driveFetch(`/drive/v3/files/${f.id}?alt=media`);
    if (!dl.ok) throw new Error("Gagal mengunduh (" + dl.status + ")");
    const text = await dl.text();
    const data = JSON.parse(text);
    if (!data.tables || data.app !== "KasirKu") throw new Error("File backup tidak valid.");
    if (!confirm(`Restore backup "${f.name}"? Data saat ini akan DIGANTI.`)) return;
    await DB.db.transaction("rw", DB.db.tables, async () => {
      for (const t of TABLES) await DB.db.table(t).clear();
      for (const t of TABLES) {
        const rows = data.tables[t] || [];
        if (rows.length) await DB.db.table(t).bulkAdd(rows);
      }
    });
    onProgress && onProgress("Restore selesai.");
    App.route();
  }

  function signOut() {
    accessToken = null;
    App.toast("Koneksi Google diputus (token dihapus)");
  }

  return {
    exportJson, importJson,
    backupToDrive, restoreFromDrive, signOut, signIn,
  };
})();

</script>
<script>
/* === js/settings.js === */
/* KasirKu — pengaturan: profil toko + backup */
const Settings = (() => {
  async function render() {
    const storeName = await DB.getSetting("storeName", "ZEA MART");
    const storeAddress = await DB.getSetting("storeAddress", "");
    const storePhone = await DB.getSetting("storePhone", "");
    const clientId = await DB.getSetting("googleClientId", "");
    const prodCount = await DB.db.products.count();
    const txCount = await DB.db.transactions.count();

    return `
      <div class="page-head">
        <div><h2>Pengaturan</h2><div class="sub">Profil toko & cadangan data</div></div>
      </div>

      <div class="card" style="margin-bottom:16px;max-width:640px">
        <h3 style="margin-bottom:14px">Profil Toko</h3>
        <div class="field"><label>Nama toko (tampil di struk)</label>
          <input id="s-name" value="${App.esc(storeName)}"></div>
        <div class="field"><label>Alamat</label>
          <input id="s-addr" value="${App.esc(storeAddress)}"></div>
        <div class="field"><label>Telepon</label>
          <input id="s-phone" value="${App.esc(storePhone)}"></div>
        <button class="btn btn-primary" id="s-save">${icon('check', 15)} Simpan Profil</button>
      </div>

      <div class="card" style="margin-bottom:16px;max-width:640px">
        <h3 style="margin-bottom:6px">Backup File (JSON)</h3>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px">
          ${prodCount} produk · ${txCount} transaksi tersimpan di perangkat ini.</p>
        <div class="row2" style="margin:0">
          <button class="btn btn-primary" id="b-export">${icon('download', 15)} Unduh Backup</button>
          <label class="btn btn-ghost" style="cursor:pointer">${icon('upload', 15)} Restore dari File
            <input type="file" id="b-import" accept=".json,application/json" style="display:none"></label>
        </div>
      </div>

      <div class="card" style="max-width:640px">
        <h3 style="margin-bottom:6px">Backup Google Drive</h3>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px">
          Cadangan otomatis ke folder khusus aplikasi di Google Drive milikmu.
          Butuh <b>OAuth Client ID</b> gratis — caranya 10 menit, lihat
          <b>PANDUAN_DRIVE.md</b> di folder aplikasi.</p>
        <div class="field"><label>Google OAuth Client ID</label>
          <input id="g-client" placeholder="xxxx.apps.googleusercontent.com" value="${App.esc(clientId)}"></div>
        <div class="row2" style="margin:0 0 10px">
          <button class="btn btn-ghost" id="g-save">Simpan ID</button>
          <button class="btn btn-ghost" id="g-connect">${icon('cloud', 15)} Hubungkan Google</button>
        </div>
        <div class="row2" style="margin:0">
          <button class="btn btn-primary" id="g-backup">${icon('cloud', 15)} Backup ke Drive</button>
          <button class="btn btn-ghost" id="g-restore">${icon('download', 15)} Restore dari Drive</button>
        </div>
        <div id="g-status" style="font-size:13px;color:var(--muted);margin-top:12px"></div>
      </div>`;
  }

  function status(msg) {
    const el = document.getElementById("g-status");
    if (el) el.textContent = msg;
  }

  function bind() {
    document.getElementById("s-save").onclick = async () => {
      await DB.setSetting("storeName", document.getElementById("s-name").value.trim() || "ZEA MART");
      await DB.setSetting("storeAddress", document.getElementById("s-addr").value.trim());
      await DB.setSetting("storePhone", document.getElementById("s-phone").value.trim());
      const n = await DB.getSetting("storeName");
      const b = document.getElementById("brand-store"); if (b) b.textContent = n;
      const c = document.getElementById("cashier-store"); if (c) c.textContent = n;
      App.toast("Profil toko disimpan");
    };
    document.getElementById("b-export").onclick = () => Backup.exportJson().catch((e) => App.toast(e.message, false));
    document.getElementById("b-import").onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      try { await Backup.importJson(f); }
      catch (err) { App.toast(err.message, false); }
      e.target.value = "";
    };
    document.getElementById("g-save").onclick = async () => {
      await DB.setSetting("googleClientId", document.getElementById("g-client").value.trim());
      App.toast("Client ID disimpan");
    };
    document.getElementById("g-connect").onclick = async () => {
      status("Menghubungkan…");
      try { await Backup.signIn(); status("Terhubung ke Google Drive."); App.toast("Google terhubung"); }
      catch (e) { status(""); App.toast(e.message, false); }
    };
    document.getElementById("g-backup").onclick = async () => {
      status("Memulai backup…");
      try {
        const name = await Backup.backupToDrive(status);
        App.toast("Backup ke Drive berhasil");
      } catch (e) { status(""); App.toast(e.message, false); }
    };
    document.getElementById("g-restore").onclick = async () => {
      status("Memulai restore…");
      try {
        await Backup.restoreFromDrive(status);
        App.toast("Restore dari Drive berhasil");
      } catch (e) { status(""); App.toast(e.message, false); }
    };
  }

  async function renderWithBind() {
    const html = await render();
    setTimeout(bind, 0);
    return html;
  }
  return { render: renderWithBind };
})();

</script>
</body>
</html>
