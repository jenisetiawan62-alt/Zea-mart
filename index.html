:root{
  --emerald:#059669;--emerald-dark:#047857;--emerald-50:#ecfdf5;
  --amber:#f59e0b;--red:#ef4444;--red-dark:#b91c1c;
  --ink:#1c1917;--muted:#78716c;--faint:#a8a29e;
  --bg:#f4f4f2;--card:#fff;--line:#e9e7e4;
  --radius:18px;
  --shadow:0 2px 8px rgba(0,0,0,.05);
  --shadow-lg:0 14px 30px rgba(0,0,0,.12);
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Plus Jakarta Sans","Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}

/* ============ SHELL ============ */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:252px;flex-shrink:0;
  background:linear-gradient(180deg,#0c2620 0%,#071a14 100%);
  color:#d6d3d1;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{padding:24px 22px 16px;display:flex;align-items:center;gap:12px}
.brand-mark{width:44px;height:44px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,#10b981,#059669);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 18px rgba(16,185,129,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.brand h1{font-size:20px;color:#fff;font-weight:800}
.brand p{font-size:11.5px;color:#a8a29e;margin-top:3px}
.shift{margin:0 18px 14px;padding:11px 14px;border-radius:13px;
  background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.22);
  font-size:12.5px;display:flex;align-items:center;gap:9px;color:#a7f3d0;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399}
.nav-sec{font-size:10.5px;font-weight:700;color:#78716c;letter-spacing:1.2px;
  padding:10px 32px 6px;text-transform:uppercase}
.nav{padding:0 12px;display:flex;flex-direction:column;gap:3px}
.nav.grow{flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;
  color:#a8a29e;text-decoration:none;font-size:14px;font-weight:600}
.nav a svg{width:19px;height:19px;opacity:.85;flex-shrink:0}
.nav a:hover{background:rgba(255,255,255,.06);color:#e7e5e4}
.nav a.active{background:linear-gradient(135deg,#059669,#10b981);color:#fff;
  box-shadow:0 8px 18px rgba(5,150,105,.45)}
.nav a .nbadge{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--amber);
  color:#fff;border-radius:999px;padding:2px 8px}
.cashier{margin:14px;padding:13px 14px;border-radius:15px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  display:flex;align-items:center;gap:11px}
.avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#f59e0b,#f97316);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.25)}
.cashier b{display:block;font-size:14px;color:#fff}
.cashier span{font-size:11.5px;color:#a8a29e}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
#view{flex:1;padding:24px 28px 40px;overflow-x:hidden}
.bottomnav{display:none}

.page-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.page-head .sub{font-size:13px;color:var(--muted);margin-top:3px}
.page-head .spacer{flex:1}

/* ============ BUTTONS / FORMS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;cursor:pointer;font-weight:700;font-size:14px;
  padding:12px 20px;border-radius:13px;transition:.15s;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,#059669,#10b981);color:#fff;
  box-shadow:0 8px 18px rgba(5,150,105,.35)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:#57534e}
.btn-danger{background:#fef2f2;border:1.5px solid #fecaca;color:var(--red-dark)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:#57534e;margin-bottom:7px}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--line);border-radius:12px;
  padding:11px 14px;background:#fff;outline:none;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--emerald)}
.frow{display:flex;gap:12px}.frow .field{flex:1}

/* ============ CARDS / TABLES ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.3px}
.stat .v.green{color:var(--emerald-dark)}.stat .v.red{color:var(--red-dark)}
.stat .v.amber{color:#b45309}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.tbl-wrap .tbl-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);background:#fafaf9;white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid #f3f1ee;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.clickable{cursor:pointer}.tbl tr.clickable:hover{background:#fafaf9}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
.pill.green{background:#ecfdf5;color:#047857}.pill.red{background:#fef2f2;color:#b91c1c}
.pill.amber{background:#fef3c7;color:#b45309}.pill.gray{background:#f4f4f2;color:#57534e}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px}
.error-box{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:14px;padding:18px}
.page-loading{padding:40px;text-align:center;color:var(--muted)}

/* ============ POS ============ */
.pos-layout{display:flex;gap:0;min-height:calc(100vh - 48px)}
.pos-main{flex:1;min-width:0;padding:24px 26px;display:flex;flex-direction:column}
.pos-top{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.pos-top h2{font-size:22px;font-weight:800}
.pos-top .date{font-size:13px;color:var(--muted);margin-top:3px}
.omzet-chip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:9px 16px;box-shadow:var(--shadow)}
.omzet-chip .lbl{font-size:11px;color:var(--muted);font-weight:600}
.omzet-chip b{font-size:15px;color:var(--emerald-dark)}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;background:#fff;
  border:1px solid var(--line);border-radius:14px;padding:11px 16px;width:320px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search input{border:none;outline:none;font-size:14px;width:100%;background:transparent}
.scan-btn{flex-shrink:0;width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);
  background:#ecfdf5;color:var(--emerald-dark);cursor:pointer;display:flex;align-items:center;justify-content:center}
.scan-btn:active{transform:scale(.94)}
/* layar scan barcode */
#scan-wrap{position:fixed;inset:0;z-index:200;background:#0c0a09;display:flex;flex-direction:column}
.scan-top{padding:20px;text-align:center;color:#fff}
.scan-top b{font-size:17px;display:block}
.scan-top span{font-size:13px;color:#a8a29e}
.scan-view{position:relative;flex:1;overflow:hidden;margin:0 20px;border-radius:20px;background:#1c1917}
.scan-view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-corners i{position:absolute;width:34px;height:34px;border:4px solid #10b981}
.scan-corners .tl{top:16%;left:12%;border-right:none;border-bottom:none;border-radius:12px 0 0 0}
.scan-corners .tr{top:16%;right:12%;border-left:none;border-bottom:none;border-radius:0 12px 0 0}
.scan-corners .bl{bottom:16%;left:12%;border-right:none;border-top:none;border-radius:0 0 0 12px}
.scan-corners .br{bottom:16%;right:12%;border-left:none;border-top:none;border-radius:0 0 12px 0}
.scan-line{position:absolute;left:12%;right:12%;top:16%;height:3px;border-radius:99px;
  background:linear-gradient(90deg,transparent,#10b981,transparent);
  animation:scanline 1.8s ease-in-out infinite}
@keyframes scanline{0%,100%{top:16%}50%{top:82%}}
.scan-cancel{margin:20px;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:15px;border:none;border-radius:15px;background:#292524;color:#fff;
  font-size:15px;font-weight:700;cursor:pointer}
.cats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.cat{padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:700;
  background:#fff;border:1px solid var(--line);color:#57534e;cursor:pointer}
.cat.active{background:var(--ink);border-color:var(--ink);color:#fff}
.cat .n{font-size:11px;opacity:.6;font-weight:600;margin-left:4px}
/* aksi laporan */
.rep-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-line{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;
  font-size:13px;font-weight:700;background:#fff;border:1.5px solid var(--line);
  color:var(--emerald-dark);cursor:pointer;white-space:nowrap}
.btn-line:active{transform:scale(.96)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px;align-content:start}
.pcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  cursor:pointer;transition:.16s;box-shadow:var(--shadow);position:relative}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.pcard.out{opacity:.55}
.pvisual{height:104px;display:flex;align-items:center;justify-content:center;position:relative}
.pvisual svg{width:46px;height:46px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.16))}
.pflag{position:absolute;top:10px;left:10px;z-index:2;font-size:10px;font-weight:800;
  letter-spacing:.6px;text-transform:uppercase;background:linear-gradient(135deg,#f59e0b,#f97316);
  color:#fff;padding:4px 10px;border-radius:999px}
.stock-chip{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.94);padding:4px 10px;border-radius:999px;color:#44403c}
.stock-chip.low{background:#fef3c7;color:#b45309}
.stock-chip.out{background:#fee2e2;color:#b91c1c}
.pcard-body{padding:12px 14px 13px}
.pcard-body h3{font-size:14px;font-weight:700}
.pcard-body .pcat{font-size:12px;color:var(--muted);margin:2px 0 9px}
.prow{display:flex;align-items:center;justify-content:space-between}
.price{font-size:15.5px;font-weight:800;color:var(--emerald-dark)}
.add{width:32px;height:32px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-size:19px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(5,150,105,.35)}

/* order panel */
.order{width:392px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);
  display:flex;flex-direction:column;max-height:calc(100vh - 0px);position:sticky;top:0;height:100vh}
.order-head{padding:20px 22px 12px;border-bottom:1px solid var(--line)}
.order-head .lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.order-head h2{font-size:17px;margin-top:5px;font-weight:800}
.order-head .no{color:var(--emerald-dark)}
.otype{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-top:12px}
.otype button{flex:1;border:none;background:transparent;font-size:12.5px;font-weight:700;
  padding:8px 0;border-radius:9px;color:var(--muted);cursor:pointer}
.otype button.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.oitems{flex:1;overflow-y:auto;padding:4px 22px;min-height:80px}
.oitem{display:flex;gap:11px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:center}
.oitem:last-child{border-bottom:none}
.thumb{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:16px;color:#fff}
.oitem-info{flex:1;min-width:0}.oitem-info b{font-size:13px;display:block}
.oitem-info span{font-size:11.5px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:7px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:15px;color:#57534e;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty b{font-size:13.5px;min-width:15px;text-align:center}
.oitem-total{font-size:13px;font-weight:800;min-width:70px;text-align:right}
.oempty{padding:30px 10px;text-align:center;color:var(--faint);font-size:13.5px}
.totals{padding:14px 22px 6px;border-top:1px solid var(--line);background:#fafaf9}
.trow{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;color:#57534e;font-weight:500}
.trow.disc{color:var(--emerald-dark);font-weight:700}
.trow.grand{font-size:17px;font-weight:800;color:var(--ink);padding-top:9px;margin-top:6px;border-top:1px solid var(--line)}
.pay{padding:14px 22px 20px}
.pay-btn{width:100%;padding:15px;border:none;border-radius:15px;cursor:pointer;
  background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-size:16px;font-weight:800;
  box-shadow:0 10px 22px rgba(5,150,105,.4)}
.pay-btn:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
.row2{display:flex;gap:9px;margin-top:10px}
.ghost{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font-size:13px;font-weight:700;color:#78716c;cursor:pointer}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(28,25,23,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal{width:440px;max-width:100%;max-height:92vh;overflow-y:auto;background:#fff;border-radius:24px;
  box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal-head{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:18px;font-weight:800}
.modal-x{width:32px;height:32px;border-radius:50%;background:var(--bg);border:none;
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;cursor:pointer}
.modal-body{padding:16px 24px 24px}
.due{margin-top:4px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid #a7f3d0;
  border-radius:16px;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}
.due span{font-size:12.5px;color:#065f46;font-weight:700}
.due b{font-size:23px;color:#065f46;font-weight:800}
.tender-lbl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin:16px 0 8px}
.tender{border:2px solid var(--emerald);border-radius:14px;padding:13px 18px;font-size:25px;
  font-weight:800;text-align:right;background:#f0fdf4;width:100%;outline:none}
.quick{display:flex;gap:8px;margin-top:10px}
.quick button{flex:1;font-size:12.5px;font-weight:700;border:1.5px solid var(--line);border-radius:11px;
  padding:10px 0;color:#57534e;background:#fff;cursor:pointer}
.quick button.active{border-color:var(--emerald);color:var(--emerald-dark);background:#ecfdf5}
.change{display:flex;justify-content:space-between;align-items:center;background:var(--bg);
  border-radius:14px;padding:12px 18px;margin-top:12px}
.change span{font-size:13px;color:var(--muted);font-weight:600}
.change b{font-size:19px;color:var(--emerald-dark)}
.change b.neg{color:var(--red-dark)}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;
  border-radius:14px;padding:12px 20px;display:flex;align-items:center;gap:11px;
  font-size:13.5px;font-weight:600;box-shadow:0 14px 30px rgba(0,0,0,.3);z-index:200;
  transition:opacity .3s;max-width:calc(100vw - 40px)}
.toast .check{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0}

/* receipt */
.receipt{background:#fff;color:#111;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:13px;max-width:320px;margin:0 auto;padding:8px 4px}
.receipt .c{text-align:center}.receipt hr{border:none;border-top:1px dashed #999;margin:8px 0}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:1px 0;vertical-align:top}

/* ============ RESPONSIVE ============ */
.mobile-cartbar{display:none}
@media (max-width:1180px){
  .order{width:340px}
}
@media (max-width:1023px){
  .sidebar{display:none}
  #view{padding:16px 16px 8px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;
    border-top:1px solid var(--line);z-index:90;padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:700;color:var(--faint);text-decoration:none;padding:4px}
  .bottomnav a.active{color:var(--emerald)}
  .bottomnav svg{width:22px;height:22px}
  .shell{padding-bottom:76px}
  .pos-layout{flex-direction:column;min-height:0}
  .pos-main{padding:16px}
  .order{display:none}
  .pgrid{grid-template-columns:repeat(3,1fr);gap:10px}
  /* kartu produk padat di HP: muat banyak, gampang cari */
  .pcard{border-radius:14px}
  .pvisual{height:70px}
  .pvisual svg{width:32px;height:32px}
  .pflag{font-size:8px;padding:2px 7px;top:6px;left:6px;letter-spacing:.4px}
  .stock-chip{font-size:8.5px;padding:2px 7px;top:auto;bottom:6px;right:6px}
  .pcard-body{padding:8px 9px 9px}
  .pcard-body h3{font-size:12px;font-weight:700;line-height:1.25;min-height:30px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pcard-body .pcat{display:none}
  .price{font-size:12.5px}
  .add{width:30px;height:30px;border-radius:9px;font-size:17px}
  .prow{margin-top:6px}
  /* pil kategori: satu baris geser, hemat tempat */
  .cats{flex-wrap:nowrap;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;
    scrollbar-width:none;-ms-overflow-style:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex-shrink:0;padding:7px 14px;font-size:12.5px}
  .cat .n{font-size:10px}
  .search{width:100%;margin-left:0}
  .pos-top h2{font-size:19px}
  .mobile-cartbar{
    display:flex;position:fixed;bottom:84px;left:16px;right:16px;z-index:80;
    background:#1c1917;color:#fff;border-radius:18px;padding:13px 16px;
    align-items:center;gap:12px;box-shadow:0 14px 30px rgba(0,0,0,.35);cursor:pointer}
  .mobile-cartbar .ic{width:40px;height:40px;border-radius:13px;background:var(--emerald);
    display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
  .mobile-cartbar .bdg{position:absolute;top:-6px;right:-6px;background:var(--amber);color:#fff;
    font-size:11px;font-weight:800;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;border:2px solid #1c1917}
  .mobile-cartbar .t{flex:1}.mobile-cartbar .t b{display:block;font-size:14.5px}
  .mobile-cartbar .t span{font-size:12px;color:#a8a29e}
  .mobile-cartbar .go{background:#fff;color:#1c1917;font-weight:800;font-size:14px;
    border-radius:12px;padding:10px 18px}
  .mobile-sheet{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;justify-content:flex-end}
  .mobile-sheet .mscrim{position:absolute;inset:0;background:rgba(28,25,23,.45)}
  .mobile-sheet .msheet{position:relative;background:#fff;border-radius:24px 24px 0 0;
    max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .mobile-sheet .shead{padding:4px 22px 0}
  .mobile-sheet .shead .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .mobile-sheet .shead h2{font-size:15px;font-weight:800;margin-top:2px}
  .mobile-sheet .shead h2 .no{color:var(--emerald-dark)}
  .mobile-sheet .shead h2 .cnt{font-size:12.5px;color:var(--muted);font-weight:600}
  .mobile-sheet .otype{margin:12px 22px 0}
  .mobile-sheet .oitems{max-height:38vh}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .frow{flex-direction:column}
}
@media print{
  body{background:#fff}
  .sidebar,.bottomnav,.mobile-cartbar,.no-print{display:none!important}
  #view{padding:0}
  .receipt{max-width:280px}
  .stat-grid{grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{break-inside:avoid}
  .card{break-inside:avoid;box-shadow:none}
  .tbl{font-size:12px}
}

.kic svg{display:block}

    scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 9v6"/><path d="M11 9v6"/><path d="M14.5 9v6"/><path d="M18 9v6"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    chevDown: '<path d="m6 9 6 6 6-6"/>',
    chevRight: '<path d="m9 18 6-6-6-6"/>',
    calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
    cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
    fileText: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
    store: '<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/>',
    alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
    shoppingBag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'
  };

  /**
   * @param {string} name nama icon (lihat daftar P di atas)
   * @param {number} size ukuran px (default 20)
   * @param {object} opts {sw: stroke-width, color: stroke override, cls: class tambahan}
   * @returns {string} markup <svg>
   */
  function icon(name, size, opts) {
    size = size || 20;
    opts = opts || {};
    const inner = P[name];
    if (!inner) {
      console.warn('[icons] unknown icon:', name);
      return '';
    }
    const sw = opts.sw || 2;
    const color = opts.color || 'currentColor';
    const cls = opts.cls ? ' class="' + opts.cls + '"' : '';
    return '<svg' + cls + ' width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  }

  window.icon = icon;
  window.KasirIcons = { icon: icon, names: Object.keys(P) };

  /* Hidrasi placeholder statis: <span class="kic" data-icon="grid"
     data-size="20" data-color="#fff"></span> */
  function hydrate(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(function (el) {
      if (el.dataset.hydrated) return;
      el.innerHTML = icon(el.dataset.icon, parseInt(el.dataset.size || '20', 10), {
        color: el.dataset.color || 'currentColor',
        sw: parseFloat(el.dataset.sw || '2')
      });
      el.dataset.hydrated = '1';
    });
  }
  window.KasirIcons.hydrate = hydrate;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { hydrate(); });
  } else {
    hydrate();
  }
})();

</script>
<script>
/* === js/db.js === */
/* KasirKu — IndexedDB layer (Dexie.js)
 * Schema mirror aplikasi Flutter kasir_offline.
 * Uang = integer Rupiah, tanpa float.
 */
const DB = (() => {
  const db = new Dexie("kasirku_db");

  db.version(1).stores({
    products: "++id, name, sku, barcode, categoryId, isActive, updatedAt",
    categories: "++id, name",
    transactions: "++id, number, date, status, createdAt",
    transaction_items: "++id, transactionId, productId",
    expenses: "++id, date, category",
    stock_movements: "++id, productId, type, createdAt",
    sales_returns: "++id, transactionId, transactionItemId, productId, createdAt",
    settings: "key",
  });

  const nowIso = () => new Date().toISOString();

  const SEED_CATEGORIES = ["Minuman", "Makanan", "Snack"];
  // [name, categoryIdx, costPrice, sellPrice, stock]
  const SEED_PRODUCTS = [
    ["Kopi Susu Gula Aren", 0, 12000, 18000, 24],
    ["Teh Manis Panas", 0, 2000, 5000, 50],
    ["Es Teh Manis", 0, 2500, 6000, 36],
    ["Milo Dingin", 0, 6000, 10000, 18],
    ["Air Mineral", 0, 2000, 4000, 60],
    ["Indomie Goreng + Telur", 1, 9000, 15000, 40],
    ["Nasi Goreng Spesial", 1, 13000, 20000, 3],
    ["Ayam Geprek", 1, 8000, 13000, 25],
    ["Roti Bakar Coklat", 1, 7000, 12000, 20],
    ["Pisang Goreng (5)", 2, 6000, 10000, 28],
    ["Gorengan Campur", 2, 4000, 8000, 30],
  ];

  async function seed() {
    const catCount = await db.categories.count();
    if (catCount > 0) return; // sudah di-seed
    const now = nowIso();
    const catIds = [];
    for (const name of SEED_CATEGORIES) {
      catIds.push(await db.categories.add({ name, createdAt: now }));
    }
    for (const [name, ci, cost, sell, stock] of SEED_PRODUCTS) {
      const id = await db.products.add({
        name, sku: "", barcode: "",
        categoryId: catIds[ci],
        costPrice: cost, sellPrice: sell,
        stock, minStock: 5, unit: "pcs",
        isActive: 1, createdAt: now, updatedAt: now,
      });
      if (stock > 0) {
        await db.stock_movements.add({
          productId: id, type: "INITIAL", quantity: stock,
          stockBefore: 0, stockAfter: stock,
          referenceType: null, referenceId: null,
          note: "Stok awal", createdAt: now,
        });
      }
    }
    await db.settings.put({ key: "storeName", value: "ZEA MART" });
    await db.settings.put({ key: "storeAddress", value: "" });
    await db.settings.put({ key: "storePhone", value: "" });
    await db.settings.put({ key: "googleClientId", value: "" });
    console.log("[db] seed selesai");
  }

  async function getSetting(key, fallback = "") {
    const row = await db.settings.get(key);
    return row ? row.value : fallback;
  }

  async function setSetting(key, value) {
    await db.settings.put({ key, value });
  }

  return { db, seed, getSetting, setSetting, nowIso };
})();

</script>
<script>
/* === js/app.js === */
/* KasirKu — SPA shell: hash router + utilitas global */
const App = (() => {
  // ---------- utils ----------
  const rupiah = (n) =>
    "Rp" + Math.round(Number(n) || 0).toLocaleString("id-ID");

  const pad2 = (n) => String(n).padStart(2, "0");

  const fmtDate = (d) => {
    const dt = d instanceof Date ? d : new Date(d);
    return `${pad2(dt.getDate())}/${pad2(dt.getMonth() + 1)}/${dt.getFullYear()}`;
  };

  const fmtDateTime = (d) => {
    const dt = d instanceof Date ? d : new Date(d);
    return `${fmtDate(dt)} ${pad2(dt.getHours())}:${pad2(dt.getMinutes())}`;
  };

  const fmtLongDate = (d) => {
    const days = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const months = ["Januari","Februari","Maret","April","Mei","Juni","Juli",
      "Agustus","September","Oktober","November","Desember"];
    const dt = d instanceof Date ? d : new Date(d);
    return `${days[dt.getDay()]}, ${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()}`;
  };

  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const todayStart = () => {
    const d = new Date(); d.setHours(0, 0, 0, 0); return d;
  };
  const dayStart = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };

  // ---------- toast ----------
  function toast(msg, ok = true) {
    document.querySelectorAll(".toast").forEach((t) => t.remove());
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML =
      `<span class="check" style="background:${ok ? "#10b981" : "#ef4444"}">` +
      (ok
        ? icon('check', 13, {color:'#fff', sw:3.2})
        : icon('x', 13, {color:'#fff', sw:3.2})) +
      `</span><span>${esc(msg)}</span>`;
    document.body.appendChild(el);
    setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 2200);
  }

  // ---------- modal ----------
  function openModal(html) {
    closeModal();
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.id = "modal-scrim";
    scrim.innerHTML = `<div class="modal">${html}</div>`;
    scrim.addEventListener("click", (e) => { if (e.target === scrim) closeModal(); });
    document.body.appendChild(scrim);
    return scrim;
  }
  function closeModal() {
    document.getElementById("modal-scrim")?.remove();
  }

  // ---------- router ----------
  const routes = {
    "/kasir":      { title: "Kasir",      render: () => POS.render(),      nav: "kasir" },
    "/produk":     { title: "Produk",     render: () => Products.render(), nav: "produk" },
    "/transaksi":  { title: "Transaksi",  render: () => Transactions.render(), nav: "transaksi" },
    "/laporan":    { title: "Laporan",    render: () => Reports.render(),  nav: "laporan" },
    "/stok":       { title: "Stok",       render: () => Stock.render(),    nav: "stok" },
    "/pengeluaran":{ title: "Pengeluaran",render: () => Expenses.render(), nav: "pengeluaran" },
    "/pengaturan": { title: "Pengaturan", render: () => Settings.render(), nav: "pengaturan" },
  };

  function navActive(key) {
    document.querySelectorAll("[data-nav]").forEach((a) =>
      a.classList.toggle("active", a.dataset.nav === key));
  }

  async function route() {
    let hash = location.hash.replace(/^#/, "") || "/kasir";
    if (!routes[hash]) hash = "/kasir";
    const r = routes[hash];
    navActive(r.nav);
    const main = document.getElementById("view");
    main.innerHTML = `<div class="page-loading">Memuat…</div>`;
    try {
      main.innerHTML = await r.render();
      window.scrollTo(0, 0);
      document.getElementById("view").scrollTop = 0;
    } catch (e) {
      console.error(e);
      main.innerHTML = `<div class="error-box">Gagal memuat halaman: ${esc(e.message)}</div>`;
    }
  }

  async function init() {
    await DB.seed();
    document.getElementById("year-now") && null;
    const dt = new Date();
    const el = document.getElementById("today-label");
    if (el) el.textContent = fmtLongDate(dt);
    window.addEventListener("hashchange", route);
    await route();
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch((e) =>
        console.warn("SW gagal:", e));
    }
  }

  return {
    rupiah, fmtDate, fmtDateTime, fmtLongDate, esc, todayStart, dayStart,
    toast, openModal, closeModal, route, init, pad2,
  };
})();

document.addEventListener("DOMContentLoaded", () => App.init());

</script>
<script>
/* === js/pos.js === */
/* KasirKu — halaman Kasir (POS) */
const POS = (() => {
  let products = [], categories = [];
  let cart = new Map(); // productId -> {product, qty}
  let activeCat = 0; // 0 = semua
  let query = "";
  let orderType = "Makan di tempat";
  let payMethod = "Tunai";
  let todayRevenue = 0;

  const ORDER_TYPES = ["Makan di tempat", "Bungkus", "Antar"];
  const PAY_METHODS = ["Tunai", "QRIS", "Transfer"];

  const GRADIENTS = [
    "linear-gradient(135deg,#d1fae5,#6ee7b7)", "linear-gradient(135deg,#fef3c7,#fcd34d)",
    "linear-gradient(135deg,#dbeafe,#93c5fd)", "linear-gradient(135deg,#ede9fe,#c4b5fd)",
    "linear-gradient(135deg,#ffedd5,#fdba74)", "linear-gradient(135deg,#fce7f3,#f9a8d4)",
  ];
  const INKS = ["#065f46", "#92400e", "#1e40af", "#5b21b6", "#9a3412", "#9d174d"];

  function iconFor(catName, ink) {
    const n = /makan/i.test(catName) ? 'tileFood' : /snack|jajan/i.test(catName) ? 'tileSnack' : 'tileDrink';
    return icon(n, 52, { color: ink, sw: 1.8 });
  }

  async function load() {
    categories = await DB.db.categories.toArray();
    products = await DB.db.products.where("isActive").equals(1).toArray();
    products.sort((a, b) => a.name.localeCompare(b.name, "id"));
    // omzet hari ini (netto sederhana: tanpa retur di chip)
    const s = App.dayStart(new Date());
    const txs = await DB.db.transactions
      .where("createdAt").aboveOrEqual(s.toISOString()).toArray();
    todayRevenue = txs.filter((t) => t.status === "COMPLETED")
      .reduce((a, t) => a + t.total, 0);
  }

  function filtered() {
    const q = query.trim().toLowerCase();
    return products.filter((p) => {
      if (activeCat !== 0 && p.categoryId !== activeCat) return false;
      if (q && !(p.name.toLowerCase().includes(q) ||
        (p.sku || "").toLowerCase().includes(q) ||
        (p.barcode || "").toLowerCase().includes(q))) return false;
      return true;
    });
  }

  function catName(id) {
    const c = categories.find((c) => c.id === id);
    return c ? c.name : "-";
  }

  function cartCount() {
    let n = 0; cart.forEach((l) => (n += l.qty)); return n;
  }
  function cartSubtotal() {
    let s = 0; cart.forEach((l) => (s += l.product.sellPrice * l.qty)); return s;
  }

  // hasil scan barcode kamera → cari produk, masukkan keranjang
  async function handleScan(code) {
    const c = String(code || "").trim();
    if (!c) return;
    await load();
    const p = products.find((x) => x.isActive &&
      ((x.barcode || "").toLowerCase() === c.toLowerCase() ||
       (x.sku || "").toLowerCase() === c.toLowerCase()));
    if (p) {
      addToCart(p.id);
    } else {
      query = c;
      const s = document.getElementById("pos-search");
      if (s) s.value = c;
      renderGrid();
      App.toast(`Barcode ${c} belum terdaftar`, false);
    }
  }

  function addToCart(id) {
    const p = products.find((x) => x.id === id);
    if (!p) return;
    const line = cart.get(id);
    const cur = line ? line.qty : 0;
    if (p.stock <= cur) {
      App.toast(`Stok "${p.name}" tidak mencukupi`, false);
      return;
    }
    cart.set(id, { product: p, qty: cur + 1 });
    App.toast(`${p.name} ditambahkan`);
    refreshOrder();
  }

  function setQty(id, qty) {
    const line = cart.get(id);
    if (!line) return;
    if (qty <= 0) { cart.delete(id); }
    else {
      if (qty > line.product.stock) {
        App.toast(`Stok "${line.product.name}" tinggal ${line.product.stock}`, false);
        return;
      }
      line.qty = qty;
    }
    refreshOrder();
  }

  // ---------- nomor struk ----------
  async function nextNumber() {
    const d = new Date();
    const ymd = `${d.getFullYear()}${App.pad2(d.getMonth() + 1)}${App.pad2(d.getDate())}`;
    const prefix = `TRX-${ymd}-`;
    const s = App.dayStart(d).toISOString();
    const count = await DB.db.transactions
      .where("createdAt").aboveOrEqual(s).toArray()
      .then((rows) => rows.filter((t) => (t.number || "").startsWith(prefix)).length);
    return `${prefix}${String(count + 1).padStart(4, "0")}`;
  }

  // ---------- checkout (atomik via Dexie.transaction) ----------
  async function checkout(paidAmount) {
    if (cart.size === 0) throw new Error("Keranjang masih kosong.");
    const lines = [...cart.values()];
    // validasi ulang dari DB
    for (const l of lines) {
      const p = await DB.db.products.get(l.product.id);
      if (!p || !p.isActive) throw new Error(`Produk "${l.product.name}" sudah tidak aktif.`);
      if (p.stock < l.qty) throw new Error(`Stok "${p.name}" tidak mencukupi (tersedia ${p.stock}).`);
      l.product = p;
    }
    const subtotal = lines.reduce((s, l) => s + l.product.sellPrice * l.qty, 0);
    const discount = 0;
    const total = subtotal - discount;
    if (paidAmount < total) throw new Error("Uang pembayaran kurang dari total.");

    const number = await nextNumber();
    const now = DB.nowIso();

    await DB.db.transaction("rw",
      DB.db.transactions, DB.db.transaction_items,
      DB.db.products, DB.db.stock_movements,
      async () => {
        const txId = await DB.db.transactions.add({
          number, date: now, subtotal, discount, total,
          paid: paidAmount, change: paidAmount - total,
          paymentMethod: payMethod, orderType,
          status: "COMPLETED", createdAt: now,
        });
        for (const l of lines) {
          await DB.db.transaction_items.add({
            transactionId: txId, productId: l.product.id,
            productName: l.product.name, sku: l.product.sku || "",
            qty: l.qty, price: l.product.sellPrice, discount: 0,
            subtotal: l.product.sellPrice * l.qty,
            costPrice: l.product.costPrice || 0,
          });
          const before = l.product.stock;
          const after = before - l.qty;
          await DB.db.products.update(l.product.id, { stock: after, updatedAt: now });
          await DB.db.stock_movements.add({
            productId: l.product.id, type: "STOCK_OUT", quantity: l.qty,
            stockBefore: before, stockAfter: after,
            referenceType: "transaction", referenceId: txId,
            note: `Penjualan ${number}`, createdAt: now,
          });
        }
      });

    const saved = (await DB.db.transactions.where("number").equals(number).toArray())[0];
    cart.clear();
    return saved;
  }

  // ---------- render ----------
  function productCard(p, i) {
    const g = GRADIENTS[i % GRADIENTS.length];
    const ink = INKS[i % INKS.length];
    const stockCls = p.stock === 0 ? "out" : p.stock <= (p.minStock || 5) ? "low" : "";
    const stockTxt = p.stock === 0 ? "Habis" : `Stok ${p.stock}`;
    const flag = i === 0 ? `<div class="pflag">Terlaris</div>` : "";
    return `
      <div class="pcard ${p.stock === 0 ? "out" : ""}" data-add="${p.id}">
        ${flag}
        <div class="pvisual" style="background:${g}">
          ${iconFor(catName(p.categoryId), ink)}
          <div class="stock-chip ${stockCls}">${stockTxt}</div>
        </div>
        <div class="pcard-body">
          <h3>${App.esc(p.name)}</h3>
          <div class="pcat">${App.esc(catName(p.categoryId))}</div>
          <div class="prow">
            <div class="price num">${App.rupiah(p.sellPrice)}</div>
            <button class="add" data-add="${p.id}" ${p.stock === 0 ? "disabled style='opacity:.4'" : ""}>${icon('plus', 16, {color:'#fff'})}</button>
          </div>
        </div>
      </div>`;
  }

  function orderHtml() {
    const lines = [...cart.values()];
    const subtotal = cartSubtotal();
    const discount = 0;
    const total = subtotal - discount;
    const items = lines.length === 0
      ? `<div class="oempty">Keranjang masih kosong.<br>Ketuk produk untuk menambahkan.</div>`
      : lines.map((l) => `
        <div class="oitem">
          <div class="thumb" style="background:${GRADIENTS[l.product.id % GRADIENTS.length]};color:${INKS[l.product.id % INKS.length]}">${App.esc(l.product.name[0] || "?")}</div>
          <div class="oitem-info"><b>${App.esc(l.product.name)}</b><span class="num">${App.rupiah(l.product.sellPrice)} / pcs</span></div>
          <div class="qty">
            <button data-dec="${l.product.id}">${icon('minus', 14)}</button><b>${l.qty}</b><button data-inc="${l.product.id}">${icon('plus', 14)}</button>
          </div>
          <div class="oitem-total num">${App.rupiah(l.product.sellPrice * l.qty)}</div>
        </div>`).join("");
    return `
      <div class="order-head">
        <div class="lbl">Pesanan Baru</div>
        <h2><span class="no" id="order-number">…</span></h2>
        <div class="otype">${ORDER_TYPES.map((t) =>
          `<button class="${t === orderType ? "active" : ""}" data-otype="${t}">${t}</button>`).join("")}
        </div>
      </div>
      <div class="oitems">${items}</div>
      <div class="totals">
        <div class="trow"><span>Subtotal (${cartCount()} item)</span><span class="num">${App.rupiah(subtotal)}</span></div>
        <div class="trow grand"><span>Total</span><span class="num">${App.rupiah(total)}</span></div>
      </div>
      <div class="pay">
        <div class="tender-lbl" style="margin:0 0 8px">Metode</div>
        <div class="quick" style="margin:0 0 12px">${PAY_METHODS.map((m) =>
          `<button class="${m === payMethod ? "active" : ""}" data-pay="${m}">${m}</button>`).join("")}
        </div>
        <button class="pay-btn" id="btn-bayar" ${lines.length === 0 ? "disabled" : ""}>Bayar · ${App.rupiah(total)}</button>
        <div class="row2">
          <button class="ghost" id="btn-tahan">Tahan</button>
          <button class="ghost" id="btn-batal">Batal</button>
        </div>
      </div>`;
  }

  function bindOrder(root) {
    root.querySelectorAll("[data-inc]").forEach((b) =>
      b.onclick = () => addToCart(Number(b.dataset.inc)));
    root.querySelectorAll("[data-dec]").forEach((b) =>
      b.onclick = () => {
        const id = Number(b.dataset.dec);
        const l = cart.get(id);
        if (l) setQty(id, l.qty - 1);
      });
    root.querySelectorAll("[data-otype]").forEach((b) =>
      b.onclick = () => { orderType = b.dataset.otype; refreshOrder(); });
    root.querySelectorAll("[data-pay]").forEach((b) =>
      b.onclick = () => { payMethod = b.dataset.pay; refreshOrder(); });
    const bayar = root.querySelector("#btn-bayar");
    if (bayar) bayar.onclick = () => openPayment();
    const tahan = root.querySelector("#btn-tahan");
    if (tahan) tahan.onclick = () => App.toast("Pesanan ditahan (fitur segera hadir)");
    const batal = root.querySelector("#btn-batal");
    if (batal) batal.onclick = () => { cart.clear(); refreshOrder(); App.toast("Keranjang dikosongkan"); };
    nextNumber().then((n) => {
      const el = root.querySelector("#order-number");
      if (el) el.textContent = n;
    });
  }

  function refreshOrder() {
    const desktop = document.getElementById("order-panel");
    if (desktop) { desktop.innerHTML = orderHtml(); bindOrder(desktop); }
    const bar = document.getElementById("mobile-cartbar");
    if (bar) {
      const n = cartCount();
      bar.style.display = n === 0 ? "none" : "flex";
      bar.querySelector(".bdg").textContent = n;
      bar.querySelector(".t b").textContent = App.rupiah(cartSubtotal());
      bar.querySelector(".t span").textContent = `${n} item di keranjang`;
    }
    const sheet = document.getElementById("mobile-sheet-body");
    if (sheet) renderMobileSheet(sheet);
  }

  // ---------- pembayaran ----------
  function openPayment() {
    if (cart.size === 0) return;
    const total = cartSubtotal();
    if (payMethod !== "Tunai") {
      doCheckout(total);
      return;
    }
    const scrim = App.openModal(`
      <div class="modal-head"><h3>Pembayaran Tunai</h3><button class="modal-x" id="m-x">${icon('x', 16)}</button></div>
      <div class="modal-body">
        <div class="due"><span>Total tagihan</span><b class="num">${App.rupiah(total)}</b></div>
        <div class="tender-lbl">Uang diterima</div>
        <input class="tender num" id="m-paid" type="number" inputmode="numeric" value="${total}">
        <div class="quick" id="m-quick">
          <button data-cash="${total}">Uang Pas</button>
          <button data-cash="20000">20rb</button>
          <button data-cash="50000">50rb</button>
          <button data-cash="100000">100rb</button>
        </div>
        <div class="change"><span>Kembalian</span><b class="num" id="m-change">Rp0</b></div>
        <div style="margin-top:16px"><button class="pay-btn" id="m-done">Selesaikan Pembayaran</button></div>
      </div>`);
    const paid = scrim.querySelector("#m-paid");
    const change = scrim.querySelector("#m-change");
    const upd = () => {
      const v = Number(paid.value) || 0;
      const c = v - total;
      change.textContent = App.rupiah(Math.max(0, c));
      change.classList.toggle("neg", c < 0);
    };
    paid.addEventListener("input", upd); upd();
    scrim.querySelectorAll("#m-quick button").forEach((b) => {
      b.onclick = () => {
        scrim.querySelectorAll("#m-quick button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        paid.value = b.dataset.cash; upd();
      };
    });
    scrim.querySelector("#m-x").onclick = () => App.closeModal();
    scrim.querySelector("#m-done").onclick = () => {
      const v = Number(paid.value) || 0;
      if (v < total) { App.toast("Uang kurang dari total", false); return; }
      doCheckout(v);
    };
    setTimeout(() => paid.select(), 100);
  }

  async function doCheckout(paidAmount) {
    App.closeModal();
    try {
      const tx = await checkout(paidAmount);
      await load(); // refresh stok & omzet
      renderGrid(); refreshOrder();
      showReceipt(tx);
      App.toast("Pembayaran berhasil");
    } catch (e) {
      console.error(e);
      App.toast(e.message || "Gagal memproses pembayaran", false);
    }
  }

  async function showReceipt(tx) {
    const items = await DB.db.transaction_items.where("transactionId").equals(tx.id).toArray();
    const storeName = await DB.getSetting("storeName", "ZEA MART");
    const storeAddr = await DB.getSetting("storeAddress", "");
    const storePhone = await DB.getSetting("storePhone", "");
    const rows = items.map((it) => `
      <tr><td>${App.esc(it.productName)}<br><span style="color:#666">${it.qty} x ${App.rupiah(it.price)}</span></td>
      <td style="text-align:right">${App.rupiah(it.subtotal)}</td></tr>`).join("");
    App.openModal(`
      <div class="modal-head"><h3>Struk</h3><button class="modal-x" onclick="App.closeModal()">${icon('x', 16)}</button></div>
      <div class="modal-body">
        <div class="receipt" id="receipt-print">
          <div class="c"><b>${App.esc(storeName)}</b><br>${App.esc(storeAddr)}${storeAddr ? "<br>" : ""}${App.esc(storePhone)}</div>
          <hr>
          <div class="c">${App.esc(tx.number)}<br>${App.fmtDateTime(tx.date)}</div>
          <hr>
          <table>${rows}</table>
          <hr>
          <table>
            <tr><td>Subtotal</td><td style="text-align:right">${App.rupiah(tx.subtotal)}</td></tr>
            <tr><td>Diskon</td><td style="text-align:right">${App.rupiah(tx.discount)}</td></tr>
            <tr><td><b>Total</b></td><td style="text-align:right"><b>${App.rupiah(tx.total)}</b></td></tr>
            <tr><td>Bayar (${App.esc(tx.paymentMethod)})</td><td style="text-align:right">${App.rupiah(tx.paid)}</td></tr>
            <tr><td>Kembali</td><td style="text-align:right">${App.rupiah(tx.change)}</td></tr>
          </table>
          <hr>
          <div class="c">Terima kasih<br>Barang yang sudah dibeli<br>tidak dapat ditukar</div>
        </div>
        <div style="margin-top:16px" class="no-print">
          <button class="pay-btn" onclick="window.print()">Cetak Struk</button>
        </div>
      </div>`);
  }

  // ---------- mobile sheet ----------
  function renderMobileSheet(body) {
    const lines = [...cart.values()];
    const subtotal = cartSubtotal();
    body.innerHTML = `
      <div class="shead"><div class="l">Keranjang</div><h2><span class="no" id="m-number">…</span> <span class="cnt">· ${cartCount()} item</span></h2></div>
      <div class="otype">${ORDER_TYPES.map((t) =>
        `<button class="${t === orderType ? "active" : ""}" data-motype="${t}">${t}</button>`).join("")}</div>
      <div class="oitems">${lines.map((l) => `
        <div class="oitem">
          <div class="oitem-info"><b>${App.esc(l.product.name)}</b><span class="num">${App.rupiah(l.product.sellPrice)} / pcs</span></div>
          <div class="qty"><button data-mdec="${l.product.id}">${icon('minus', 14)}</button><b>${l.qty}</b><button data-minc="${l.product.id}">${icon('plus', 14)}</button></div>
          <div class="oitem-total num">${App.rupiah(l.product.sellPrice * l.qty)}</div>
        </div>`).join("") || `<div class="oempty">Keranjang kosong</div>`}</div>
      <div class="totals">
        <div class="trow"><span>Subtotal</span><span class="num">${App.rupiah(subtotal)}</span></div>
        <div class="trow grand"><span>Total</span><span class="num">${App.rupiah(subtotal)}</span></div>
      </div>
      <div class="pay">
        <div class="tender-lbl" style="margin:0 0 8px">Metode</div>
        <div class="quick" style="margin:0 0 12px">${PAY_METHODS.map((m) =>
          `<button class="${m === payMethod ? "active" : ""}" data-mpay="${m}">${m}</button>`).join("")}</div>
        <button class="pay-btn" id="m-bayar" ${lines.length === 0 ? "disabled" : ""}>Bayar · ${App.rupiah(subtotal)}</button>
      </div>`;
    body.querySelectorAll("[data-minc]").forEach((b) =>
      b.onclick = (e) => { e.stopPropagation(); addToCart(Number(b.dataset.minc)); });
    body.querySelectorAll("[data-mdec]").forEach((b) =>
      b.onclick = (e) => { e.stopPropagation(); const id = Number(b.dataset.mdec); const l = cart.get(id); if (l) setQty(id, l.qty - 1); });
    body.querySelectorAll("[data-motype]").forEach((d) =>
      d.onclick = () => { orderType = d.dataset.motype; renderMobileSheet(body); });
    body.querySelectorAll("[data-mpay]").forEach((d) =>
      d.onclick = () => { payMethod = d.dataset.mpay; renderMobileSheet(body); });
    const bb = body.querySelector("#m-bayar");
    if (bb) bb.onclick = () => { closeMobileSheet(); openPayment(); };
    nextNumber().then((n) => {
      const el = body.querySelector("#m-number");
      if (el) el.textContent = n;

  function openMobileSheet() {
    if (cart.size === 0) { App.toast("Keranjang masih kosong", false); return; }
    const wrap = document.createElement("div");
    wrap.className = "mobile-sheet"; wrap.id = "mobile-sheet";
    wrap.innerHTML = `<div class="mscrim"></div>
      <div class="msheet"><div class="grab" style="padding:12px 0 4px;display:flex;justify-content:center">
        <div style="width:44px;height:5px;border-radius:99px;background:#d6d3d1"></div></div>
        <div id="mobile-sheet-body" style="overflow-y:auto"></div></div>`;
    wrap.querySelector(".mscrim").onclick = closeMobileSheet;
    document.body.appendChild(wrap);
    renderMobileSheet(wrap.querySelector("#mobile-sheet-body"));
  }
  function closeMobileSheet() {
    document.getElementById("mobile-sheet")?.remove();
  }

  function renderGrid() {
    const g = document.getElementById("pgrid");
    if (!g) return;
    const list = filtered();
    g.innerHTML = list.length === 0
      ? `<div class="empty" style="grid-column:1/-1">Produk tidak ditemukan.</div>`
      : list.map((p, i) => productCard(p, i)).join("");
    g.querySelectorAll("[data-add]").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        addToCart(Number(el.dataset.add));

  }

  async function render() {
    await load();
    const catPills = [
      `<button class="cat ${activeCat === 0 ? "active" : ""}" data-cat="0">Semua <span class="n">${products.length}</span></button>`,
      ...categories.map((c) => {
        const n = products.filter((p) => p.categoryId === c.id).length;
        return `<button class="cat ${activeCat === c.id ? "active" : ""}" data-cat="${c.id}">${App.esc(c.name)} <span class="n">${n}</span></button>`;
      }),
    ].join("");

    const html = `
    <div class="pos-layout">
      <div class="pos-main">
        <div class="pos-top">
          <div><h2>Kasir</h2><div class="date" id="today-label">${App.fmtLongDate(new Date())}</div></div>
          <div class="omzet-chip"><div><div class="lbl">Omzet hari ini</div><b class="num">${App.rupiah(todayRevenue)}</b></div></div>
          <div class="search">
            ${icon('search', 18)}
            <input id="pos-search" placeholder="Cari produk / scan barcode…" value="${App.esc(query)}">
            <button class="scan-btn" id="pos-scan" title="Scan barcode kamera" type="button">${icon('scan', 19)}</button>
          </div>
        </div>
        <div class="cats">${catPills}</div>
        <div class="pgrid" id="pgrid"></div>
      </div>
      <aside class="order" id="order-panel"></aside>
    </div>
    <div class="mobile-cartbar" id="mobile-cartbar" style="display:none">
      <div class="ic">
        ${icon('cart', 20, {color:'#fff'})}
        <div class="bdg">0</div>
      </div>
      <div class="t"><b class="num">Rp0</b><span>0 item di keranjang</span></div>
      <div class="go">Bayar</div>
    </div>`;

    // bind setelah innerHTML dipasang oleh router
    setTimeout(() => {
      renderGrid(); refreshOrder();
      const s = document.getElementById("pos-search");
      if (s) s.addEventListener("input", () => { query = s.value; renderGrid(); });
      const sc = document.getElementById("pos-scan");
      if (sc) sc.onclick = () => Scanner.open(handleScan);
      document.querySelectorAll("[data-cat]").forEach((b) =>
        b.onclick = () => {
          activeCat = Number(b.dataset.cat);
          document.querySelectorAll("[data-cat]").forEach((x) =>
            x.classList.toggle("active", x === b));
          renderGrid();
        });
      const bar = document.getElementById("mobile-cartbar");
      if (bar) bar.onclick = openMobileSheet;
    }, 0);

    return html;
  }

  // expose untuk refresh dari luar bila perlu
  return { render, refreshOrder };
})();

</script>
<script>
/* === js/scan.js === */
/* KasirKu — scan barcode via kamera HP.
 * Memakai BarcodeDetector API bawaan browser (Chrome Android), tanpa library tambahan.
 * Aman di file:// maupun https (keduanya secure context).
 */
const Scanner = (() => {
  'use strict';
  const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'codabar', 'qr_code', 'data_matrix'];
  let stream = null, timer = null;

  function supported() {
    return ('BarcodeDetector' in window) &&
      !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function close() {
    if (timer) { clearInterval(timer); timer = null; }
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    const el = document.getElementById('scan-wrap');
    if (el) el.remove();
  }

  async function open(onCode) {
    if (typeof onCode !== 'function') return;
    if (!supported()) {
      App.toast('Browser ini tidak mendukung scan kamera. Ketik barcode manual ya.', false);
      return;
    }
    const wrap = document.createElement('div');
    wrap.id = 'scan-wrap';
    wrap.innerHTML = `
      <div class="scan-top"><b>Scan Barcode</b><span>Arahkan kamera ke barcode produk</span></div>
      <div class="scan-view">
        <video id="scan-video" playsinline muted></video>
        <div class="scan-corners"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
        <div class="scan-line"></div>
      </div>
      <button class="scan-cancel" id="scan-cancel">${icon('x', 18)} Batal</button>`;
    document.body.appendChild(wrap);
    wrap.querySelector('#scan-cancel').onclick = close;

    let video;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
    } catch (e) {
      close();
      App.toast('Kamera tidak bisa dibuka. Cek izin kamera browser ya.', false);
      return;
    }
    video = wrap.querySelector('#scan-video');
    video.srcObject = stream;
    try { await video.play(); } catch (e) { /* abaikan */ }

    let detector;
    try { detector = new BarcodeDetector({ formats: FORMATS }); }
    catch (e) { try { detector = new BarcodeDetector(); } catch (e2) { close(); App.toast('Pemindai tidak tersedia di perangkat ini.', false); return; } }

    let done = false;
    timer = setInterval(async () => {
      if (done || !document.getElementById('scan-wrap')) return;
      try {
        const codes = await detector.detect(video);
        if (codes && codes.length && codes[0].rawValue) {
          done = true;
          const val = String(codes[0].rawValue).trim();
          close();
          onCode(val);
        }
      } catch (e) { /* frame gagal, coba lagi */ }
    }, 350);
  }

  return { open, close, supported };
})();

</script>
<script>
/* === js/barcode.js === */
/* KasirKu — generator & label barcode EAN-13.
 * Buat kode untuk produk yang belum punya barcode, tampilkan label
 * (barcode + nama barang), dan unduh sebagai PNG untuk ditempel.
 * Murni JS tanpa library.
 */
const BarcodeLabel = (() => {
  'use strict';

  const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  const G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  const R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  const PARITY = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

  function checkDigit(d12) {
    let sum = 0;
    for (let i = 0; i < 12; i++) sum += (+d12[i]) * (i % 2 === 0 ? 1 : 3);
    return String((10 - (sum % 10)) % 10);
  }

  function encode(code) {
    const c = String(code);
    if (!/^\d{13}$/.test(c)) throw new Error('Kode harus 13 digit angka');
    const pat = PARITY[+c[0]];
    let bits = '101';
    for (let i = 0; i < 6; i++) {
      const d = +c[1 + i];
      bits += pat[i] === 'L' ? L[d] : G[d];
    }
    bits += '01010';
    for (let i = 6; i < 12; i++) bits += R[+c[i]];
    bits += '101';
    return bits; // 95 modul
  }

  // Kode internal toko: prefix 29 + 10 digit acak + digit cek EAN-13 valid
  async function genUnique() {
    for (let attempt = 0; attempt < 50; attempt++) {
      let d12 = '29';
      for (let i = 0; i < 10; i++) d12 += Math.floor(Math.random() * 10);
      const code = d12 + checkDigit(d12);
      const exists = await DB.db.products.where('barcode').equals(code).first();
      if (!exists) return code;
    }
    throw new Error('Gagal membuat kode unik');
  }

  function draw(canvas, code, name) {
    const bits = encode(code);
    const scale = 3, quiet = 10;
    const W = (bits.length + quiet * 2) * scale; // 345
    const barH = 84, guardExtra = 8;
    const padTop = 14, digitsH = 26, nameH = 30, padBot = 12;
    const H = padTop + barH + guardExtra + digitsH + nameH + padBot;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#111111';
    const x0 = quiet * scale;
    for (let i = 0; i < bits.length; i++) {
      if (bits[i] !== '1') continue;
      const isGuard = i < 3 || (i >= 45 && i < 50) || i >= 92;
      const h = barH + (isGuard ? guardExtra : 0);
      ctx.fillRect(x0 + i * scale, padTop, scale, h);
    }
    // angka kode di bawah garis
    ctx.fillStyle = '#111111';
    ctx.textAlign = 'center';
    ctx.font = '20px "Courier New", monospace';
    ctx.fillText(code, W / 2, padTop + barH + guardExtra + 22);
    // nama barang di bawahnya
    let nm = String(name || '');
    ctx.font = 'bold 17px "Plus Jakarta Sans", Arial, sans-serif';
    const maxW = W - 20;
    while (nm.length > 4 && ctx.measureText(nm).width > maxW) nm = nm.slice(0, -1);
    if (nm !== String(name || '')) nm = nm.slice(0, -1).trimEnd() + '…';
    ctx.fillText(nm, W / 2, padTop + barH + guardExtra + digitsH + 24);
    return canvas;
  }

  function download(p) {
    const canvas = document.getElementById('bc-canvas');
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    const safe = String(p.name || 'barcode').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 40) || 'barcode';
    a.download = `barcode_${safe}.png`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 500);
    App.toast('Label barcode diunduh');
  }

  async function open(productId) {
    let p = await DB.db.products.get(productId);
    if (!p) return;
    if (!p.barcode) {
      try {
        const code = await genUnique();
        await DB.db.products.update(productId, { barcode: code, updatedAt: DB.nowIso() });
        p = await DB.db.products.get(productId);
        App.toast('Barcode dibuat: ' + code);
      } catch (e) {
        App.toast('Gagal membuat barcode', false);
        return;
      }
    }
    App.openModal(`
      <div class="modal-head"><h3>Label Barcode</h3>
        <button class="modal-x" id="bc-x">${icon('x', 16)}</button></div>
      <div class="modal-body" style="text-align:center">
        <canvas id="bc-canvas" style="max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px"></canvas>
        <div style="margin:14px 0 6px">
          <button class="btn btn-primary" id="bc-download" style="width:100%">${icon('download', 15)} Unduh Label (PNG)</button>
        </div>
        <div class="sub" style="font-size:12.5px;color:var(--muted)">Cetak & tempel di produk, lalu scan dari halaman Kasir.</div>
      </div>`);
    draw(document.getElementById('bc-canvas'), p.barcode, p.name);
    document.getElementById('bc-download').onclick = () => download(p);
    document.getElementById('bc-x').onclick = () => { App.closeModal(); App.route(); };
  }

  return { open, draw, genUnique, checkDigit, encode };
})();

</script>
